name: Appli My Coach Santé (APK)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compiler l'APK
        working-directory: android
        shell: bash
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Publier l'APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk my-coach-sante.apk
          if ! gh release view sante >/dev/null 2>&1; then
            gh release create sante --title "My Coach Santé" --latest \
              --notes "Appli Android qui envoie ton sommeil, tes pas et tes pesées de Samsung Health (via Health Connect) vers My Coach. Télécharge my-coach-sante.apk ci-dessous et installe-le."
          fi
          gh release upload sante my-coach-sante.apk --clobber

      - name: Journal en cas d'échec
        if: failure()
        shell: bash
        run: |
          cp android/build.log /tmp/build.log 2>/dev/null || echo "Pas de journal de build" > /tmp/build.log
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q -b ci-log
          cp /tmp/build.log build.log
          git add build.log
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Journal du build ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log
