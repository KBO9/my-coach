const VX = { state: 'idle', idx: null, buf: null, p: null, el: null, url: '', unlocked: false, silBlock: null, kind: '', cheer: 0 };
const VX_SILENT = 'data:audio/mpeg;base64,' + '//MUxAAAAANIAAAAAExBTUUzLjEwMAAA'.repeat(12);

const VX_MIX_OK = !!(navigator.audioSession && 'type' in navigator.audioSession);

  if (VX.idx) return Promise.resolve(true);
  if (VX.p) return VX.p;
  VX.state = 'loading';
  VX.p = Promise.all([
    fetch('voix-coach.json').then(r => { if (!r.ok) throw new Error('json ' + r.status); return r.json(); }),
    fetch('voix-coach.bin').then(r => { if (!r.ok) throw new Error('bin ' + r.status); return r.arrayBuffer(); })
  ]).then(a => { VX.idx = a[0]; VX.buf = new Uint8Array(a[1]); VX.state = 'ready'; return true; })

}

function vxClip(k) { const c = VX.idx && VX.idx.c[k]; return c ? { b: VX.buf.subarray(c[0], c[0] + c[1]), d: c[2] * VX.idx.fd, f: c[2] } : null; }

function vxXing(frames, bytes) {
  const f = new Uint8Array(48), o = 13; // MPEG-2 Layer III 16 kbit/s 24 kHz mono : en-tête 4 octets + side info 9 octets

function go(tab) {
  if (!VIEWS[tab]) return;
  if (tab === TAB) { $('#v-' + tab).scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); return; }
  const cur = $('#v-' + TAB); SCROLL[TAB] = cur.scrollTop; cur.classList.remove('on');
  TAB = tab;
  const el = $('#v-' + tab); el.classList.add('on');
  render(tab, true);
  el.scrollTop = SCROLL[tab] || 0;
  updateTabbar(true); updateNavbar(); haptic();
}

/* ---------- actions (data-act) ---------- */
const ACT = {
  go: t => { closeAll(); go(t.dataset.tab); },
  closeSheet: () => closeSheet(),
  actPick: t => { const acts = ACTS_CB[t.dataset.sid]; const a = acts && acts[+t.dataset.i]; closeSheet(t.dataset.sid); if (a && a.fn) setTimeout(a.fn, 220); },
  seg: t => {
    const n = t.dataset.name, v = t.dataset.v;
    haptic();
    if (n === 'tt') { day(dkey(), true).tt = v; save(); refresh(); }
    else if (n === 'prog') { PROG_SEG = v; refresh(); }
    else if (n === 'range') { RANGE = v; refresh(); }
    else if (n === 'mode') { S.settings.mode = v; save(); refresh(); rerenderSheet('settings'); natReminders(); }
    else if (n === 'train') { S.settings.trainTime = v; save(); refresh(); rerenderSheet('settings'); }
    else if (n === 'theme') { S.settings.theme = v; save(); applyTheme(); refresh(); rerenderSheet('settings'); }
    else if (n === 'shop') { SHOP_DAYS = +v; rerenderSheet('shop'); }
    else if (n === 'pcstep') { PC.step = +v; rerenderSheet('palcalc'); }
    else if (n === 'obmode') { obCollect(); OB.mode = v; renderOB(); }
    else if (n === 'obtt') { obCollect(); OB.tt = v; renderOB(); }
    else if (n === 'nxtype') { NX.type = v; NX.reps = NX_REPS[v]; if (v !== 'pdc') NX.max = false; rerenderSheet('newex'); }
    else if (n === 'nxeq') { NX.eq = v; rerenderSheet('newex'); }
  },
  settings: () => openSettings(),
  ringsInfo: () => ringsInfo(),
  dayPeek: t => { const k = t.dataset.k; const done = sessionsOn(k); if (k > dkey()) { const p = planFor(k); if (isTrain(p)) sessionDetail(p.id); else daySheetRest(); } else daySheet(k); },
  habit: t => {
    const id = t.dataset.id, k = dkey(), r = day(k, true);
    POP = 'hab:' + id;
    if (id === 'water') { if (r.w < 30) r.w++; haptic(r.w === S.settings.waterGoal ? 'success' : 'light'); if (r.w === S.settings.waterGoal) toast('Objectif d’eau atteint', 'drop', 'var(--cyan)'); }
    else if (id === 'weigh') { openWeigh(); return; }
    else if (id === 'supps') { const all = suppsCore(k) === CORE_SUPPS.length; CORE_SUPPS.forEach(s => { if (all) delete r.sp[s]; else r.sp[s] = 1; }); haptic(all ? 'light' : 'success'); }
    else { r.h[id] = !r.h[id]; haptic(r.h[id] ? 'success' : 'light'); }
    save(); refresh(); setTimeout(checkAwards, 500);
  },
  waterMinus: () => { const r = day(dkey(), true); if (r.w > 0) r.w--; POP = 'hab:water'; save(); refresh(); },
  water: t => { const r = day(dkey(), true), d = +t.dataset.d; if (d > 0) { if (r.w < 30) { LAST_WATER = r.w; r.w++; } } else if (r.w > 0) r.w--; haptic(r.w === S.settings.waterGoal && d > 0 ? 'success' : 'light'); save(); refresh(); setTimeout(checkAwards, 500); },
  meal: t => {
    const k = dkey(), r = day(k, true), m = MEALS.find(x => x.id === t.dataset.m), st = mealState(k, m);
    if (st === 2) { m.foods.forEach(f => { delete r.f[m.id + '.' + f.id]; }); delete r.ft[m.id]; haptic(); }
    else { m.foods.forEach(f => { r.f[m.id + '.' + f.id] = 1; }); r.ft[m.id] = Date.now(); haptic('success'); if (m.id === 'din') toast('Jeûne lancé · déjeuner dès 12:00', 'timer', 'var(--orange)'); }
    POP = 'meal:' + m.id; save(); refresh();
  },
  food: t => {
    const k = dkey(), r = day(k, true), mid = t.dataset.m, key = mid + '.' + t.dataset.f;
    if (r.f[key]) delete r.f[key]; else r.f[key] = 1;
    const m = MEALS.find(x => x.id === mid), any = m.foods.some(f => r.f[mid + '.' + f.id]);
    if (any && !r.ft[mid]) r.ft[mid] = Date.now(); if (!any) delete r.ft[mid];
    haptic(); save(); refresh();
  },
  supp: t => { const r = day(dkey(), true), id = t.dataset.id; if (r.sp[id]) delete r.sp[id]; else r.sp[id] = 1; haptic(r.sp[id] ? 'success' : 'light'); save(); refresh(); },
  fastStart: () => { S.fastLog.push({ t: Date.now(), type: 'start' }); S.fastLog = S.fastLog.slice(-20); save(); haptic('success'); refresh(); toast('Jeûne démarré', 'timer', 'var(--orange)'); },
  fastEnd: () => { S.fastLog.push({ t: Date.now(), type: 'end' }); S.fastLog = S.fastLog.slice(-20); save(); haptic(); refresh(); toast('Jeûne terminé · bon appétit', 'fork', 'var(--green)'); },
  cheat: () => confirmDlg('Noter un cheat meal ?', 'Le prochain sera possible dans 10 jours.', 'Noter aujourd’hui', false, () => { if (S.cheats.indexOf(dkey()) < 0) S.cheats.push(dkey()); save(); refresh(); toast('Cheat meal noté · profite !', 'pizza', 'var(--orange)'); }),
  shop: () => openShop(),
  shopItem: t => { const k = t.dataset.k; if (S.shop[k]) delete S.shop[k]; else S.shop[k] = 1; haptic(); save(); rerenderSheet('shop'); },
  shopClear: () => { S.shop = {}; save(); rerenderSheet('shop'); },
  shopShare: () => shopShare(),
  weigh: () => openWeigh(),
  kp: t => kpPress(t.dataset.k),
  kpDay: t => { KP.d = t.dataset.d; const ex = S.weights.find(w => w.d === KP.d), ws = weightStats(); KP.v = ''; KP.ph = ex ? kg(ex.kg) : (ws ? kg(ws.current) : num(S.profile.startWeight)); haptic(); rerenderSheet('weigh'); },
  weighSave: () => weighSave(),
  weightRow: t => weightRowMenu(t.dataset.d),
  measure: () => openMeasure(),
  measureSave: () => measureSave(),
  calMove: t => { CAL_OFF = Math.min(0, CAL_OFF + (+t.dataset.d)); haptic(); refresh(); },
  award: t => awardSheet(t.dataset.id, false),
  exDetail: t => exDetail(t.dataset.id),
  timer: () => openTimer(),
  tmPreset: t => { const p = PRESETS.find(x => x.id === t.dataset.id); if (p) { openTimer({ id: p.id, name: p.name, w: p.w, r: p.r, k: p.k, c: p.c }); haptic(); paintTimer(); } },
  tmToggle: () => tmToggle(),
  tmReset: () => tmReset(),
  tmSkip: () => tmSkip(),
  tmStep: t => tmStepF(t.dataset.f, +t.dataset.d),
  history: () => historySheet(),
  records: () => recordsSheet(),
  palCalc: () => openPalCalc(),
  sessionDetail: t => sessionDetail(t.dataset.id),
  sessionView: t => { const s = S.sessions.find(x => x.id === t.dataset.id); if (s) openSummary(s, false); },
  deleteSession: t => confirmDlg('Supprimer cette séance ?', 'Elle disparaîtra de ton historique et de tes records.', 'Supprimer', true, () => { S.sessions = S.sessions.filter(x => x.id !== t.dataset.id); save(); closeSheet('summary'); rerenderSheet('history'); refresh(); toast('Séance supprimée', 'trash', 'var(--red)'); }),
  shareSession: t => shareSession(t.dataset.id),
  startSession: t => startSession(t.dataset.id),
  openWorkout: () => openWorkout(),
  finishAsk: () => finishAsk(),
  discardAsk: () => discardAsk(),
  warmDone: () => { const a = S.active; if (!a) return; a.warm.done = !a.warm.done; haptic(a.warm.done ? 'success' : 'light'); save(); rerenderSheet('workout'); },
  setCheck: t => setCheck(+t.dataset.i, +t.dataset.j),
  palCheck: t => palCheck(+t.dataset.i, +t.dataset.j),
  palToggle: t => { const ae = S.active && S.active.ex[+t.dataset.i]; if (!ae) return; ae.palOpen = !ae.palOpen; haptic(); save(); rerenderSheet('workout'); },
  addSet: t => { const ae = S.active && S.active.ex[+t.dataset.i]; if (!ae) return; const l = ae.sets[ae.sets.length - 1]; ae.sets.push({ i: l ? l.i : 0, t: 'n', target: l ? l.target : 10, w: '', r: '', done: false }); haptic(); save(); rerenderSheet('workout'); },
  exMenu: t => {
    const i = +t.dataset.i, a = S.active; if (!a) return;
    const ae = a.ex[i], ex = EXI[ae.id], acts = [];
    if (ex.vid) acts.push({ t: 'Voir la démo du coach', ic: 'video', fn: () => window.open(ex.vid, '_blank', 'noopener') });
    acts.push({ t: 'Historique de l’exercice', ic: 'history', fn: () => exDetail(ex.id) });
    acts.push({ t: 'Remplacer par un autre exercice', ic: 'swap', fn: () => openPicker('replace', a.tpl, i) });
    if (a.order.indexOf(i) < a.order.length - 1) acts.push({ t: 'Faire plus tard (machine prise)', ic: 'later', fn: () => { a.order = a.order.filter(x => x !== i).concat([i]); save(); rerenderSheet('workout'); toast('Déplacé en fin de séance', 'later', 'var(--blue)'); } });
    const lastSet = ae.sets[ae.sets.length - 1];
    if (ae.sets.length > 1 && lastSet && !lastSet.done) acts.push({ t: 'Retirer la dernière série', ic: 'minus', fn: () => { ae.sets.pop(); save(); rerenderSheet('workout'); } });
    if (a.order.length > 1) acts.push({ t: 'Retirer de la séance', ic: 'trash', de: true, fn: () => removeFromActive(i) });
    actionSheet(esc(ex.n), acts);
  },
  restPick: t => {
    const ex = EXI[S.active.ex[+t.dataset.i].id];
    actionSheet('Temps de repos · ' + ex.n, [60, 75, 90, 120, 150, 180].map(s => ({ t: clock(s) + (s === restFor(ex) ? '  ✓' : ''), fn: () => { S.restPref = S.restPref || {}; S.restPref[ex.id] = s; save(); rerenderSheet('workout'); } })).concat([{ t: 'Lancer le repos maintenant', bo: true, fn: () => startRest(restFor(ex), ex.n) }]));
  },
  exTimer: t => exTimer(+t.dataset.i),
  holdTimer: t => holdTimer(+t.dataset.i),
  islandTap: () => { const isl = $('#island'); isl.classList.toggle('big'); haptic(); },
  restAdd: t => restAdd(+t.dataset.d),
  restSkip: () => { stopRest(); haptic(); },
  toggleSet: t => {
    const k = t.dataset.k; S.settings[k] = !S.settings[k]; save(); haptic(); rerenderSheet('settings'); refresh();
    if (k === 'sound' && S.settings.sound) sound('tick');
    if (k === 'notifs') natReminders();
    if (k === 'voice' && natVoiceOn()) { natSay('C’est ton coach. Je suis là.'); }
    else if (k === 'voice') { if (S.settings.voice) { vxUnlock(); vxLoad().then(ok => { if (ok) vxSay(['voice_test'], 'Voix du coach'); rerenderSheet('settings'); }); } else vxStop(); }
  },
  waterGoal: t => { S.settings.waterGoal = clamp(S.settings.waterGoal + (+t.dataset.d), 4, 20); save(); haptic(); rerenderSheet('settings'); refresh(); },
  ics: () => exportICS(),
  export: () => exportData(),
  import: () => importData(),
  resetAsk: () => resetAsk(),
  obNext: () => { obCollect(); OB.step = Math.min(3, OB.step + 1); haptic(); renderOB(); },
  obBack: () => { obCollect(); OB.step = Math.max(0, OB.step - 1); haptic(); renderOB(); },
  obFinish: () => obFinish(),
  obRestore: () => obRestore(),
  /* programme personnalisé */
  detailEdit: t => { const id = t.dataset.id; EDIT_PROG = EDIT_PROG === id ? null : id; haptic(); rerenderSheet('detail'); refresh(); },
  progMove: t => { const k = t.dataset.id, i = +t.dataset.i, j = i + (+t.dataset.d), ids = progIds(k); if (j < 0 || j >= ids.length) return; const x = ids[i]; ids[i] = ids[j]; ids[j] = x; setProg(k, ids); haptic(); rerenderSheet('detail'); refresh(); },
  progRemove: t => { const k = t.dataset.id, i = +t.dataset.i, ids = progIds(k); if (ids.length <= 1) { toast('Garde au moins un exercice', 'info', 'var(--orange)'); return; } const e = EXI[ids[i]]; ids.splice(i, 1); setProg(k, ids); haptic(); rerenderSheet('detail'); refresh(); toast((e ? e.n : 'Exercice') + ' retiré', 'minus', 'var(--red)'); },
  progReset: t => { const k = t.dataset.id; confirmDlg('Revenir au programme du coach ?', 'La séance ' + SESS[k].name + ' retrouve ses exercices d’origine. Tes exercices perso restent dans la bibliothèque.', 'Rétablir', true, () => { setProg(k, DEF_EX[k].slice()); rerenderSheet('detail'); refresh(); toast('Programme du coach rétabli', 'reset', 'var(--blue)'); }); },
  pickAdd: t => { if (t.dataset.mode === 'prog') openPicker('prog', t.dataset.id); else if (S.active) openPicker('add', S.active.tpl); },
  library: () => openPicker('browse', ''),
  pkPick: t => pkPick(t.dataset.id),
  pkKeep: () => { PK.keep = !PK.keep; haptic(); rerenderSheet('picker'); },
  exNew: () => openNewEx(null, sheetOpen('picker') ? 'picker' : ''),
  exNewSave: () => exNewSave(),
  nxStep: t => nxStep(t.dataset.f, +t.dataset.d),
  nxGrp: t => { NX.grp = t.dataset.g; haptic(); rerenderSheet('newex'); },
  nxMax: () => { NX.max = !NX.max; haptic(); rerenderSheet('newex'); },
  exToSess: t => exToSess(t.dataset.id),
  exEdit: t => openNewEx(t.dataset.id),
  exDelete: t => deleteCustom(t.dataset.id),
  /* sauvegarde */
  cloud: () => openCloud(),
  cloudConnect: () => cloudConnect(),
  cloudNow: () => { CLOUD.err = ''; CLOUD_UI.busy = true; rerenderSheet('cloud'); cloudPush(true).then(ok => { CLOUD_UI.busy = false; rerenderSheet('cloud'); softRerender('settings'); if (ok) toast('Sauvegardé sur GitHub', 'cloudUp', 'var(--blue)'); else if (CLOUD.err) toast(CLOUD.err, 'info', 'var(--orange)'); }); },
  cloudPull: () => cloudRestore(),
  cloudPullAsk: () => confirmDlg('Récupérer depuis GitHub ?', 'Les données de ce téléphone seront remplacées par la dernière sauvegarde (un point de restauration est créé avant).', 'Récupérer', true, () => cloudRestore()),
  cloudKeep: () => cloudKeepLocal(),
  cloudAuto: () => { CLOUD.auto = !CLOUD.auto; saveCloud(); haptic(); rerenderSheet('cloud'); if (CLOUD.auto) cloudSchedule(1500); },
  cloudOff: () => confirmDlg('Déconnecter la sauvegarde cloud ?', 'Tes données restent sur ce téléphone et sur GitHub. Le jeton est effacé de ce téléphone.', 'Déconnecter', true, () => cloudDisconnect()),
  snaps: () => openSnaps(),
  snapPick: t => snapPick(t.dataset.id),
  /* Samsung Health */
  healthAuth: () => { if (NATIVE) try { MCNative.healthAuthorize(); } catch (e) { /* ignore */ } },
  santeRefresh: () => { if (NATIVE) { toast('Lecture de Samsung Health…', 'repeat', 'var(--blue)'); natHealthRead(true); return; } toast('Actualisation…', 'repeat', 'var(--blue)'); healthFetch(true).then(ch => { toast(ch ? 'Données Samsung Health à jour' : HEALTH ? 'Rien de nouveau pour l’instant' : 'Aucune donnée : ouvre l’appli My Coach Santé', ch ? 'check' : 'info', ch ? 'var(--green)' : 'var(--orange)'); softRerender('settings'); }); },
  sleepSheet: () => openSheet({ id: 'sleep', cls: 'full', render: sleepSheetHTML }),
  /* voix */
  voicePick: () => openSheet({ id: 'voice', cls: 'full', render: voiceSheetHTML }),
  voiceSel: t => { try { MCNative.ttsSetVoice(t.dataset.n); } catch (e) { /* ignore */ } haptic(); setTimeout(() => { natSay('Salut, c’est ton coach. On s’y met ?'); rerenderSheet('voice'); softRerender('settings'); }, 350); },
  enginePick: () => { let d = null; try { d = JSON.parse(MCNative.ttsEngines()); } catch (e) { d = null; } if (!d || !d.engines || !d.engines.length) { toast('Aucun autre moteur installé', 'info', 'var(--orange)'); return; } actionSheet('Moteur de synthèse vocale', d.engines.map(e => ({ t: e.label + (e.name === d.cur ? '  ✓' : ''), fn: () => { try { MCNative.ttsSetEngine(e.name); } catch (x) { /* ignore */ } toast('Moteur : ' + e.label, 'speaker', 'var(--blue)'); setTimeout(() => rerenderSheet('voice'), 1500); } }))); },
  ttsSettings: () => { try { MCNative.ttsSettings(); } catch (e) { /* ignore */ } },
  voiceTest: () => { if (natVoiceOn()) { natSay(vxText('voice_test')); return; } vxUnlock(); vxLoad().then(ok => { if (ok) { vxStop(); vxSay(['voice_test'], 'Voix du coach'); } else toast('Voix indisponible : ouvre l’app une fois avec internet', 'info', 'var(--orange)'); rerenderSheet('settings'); }); }
};

/* ---------- délégation des événements ---------- */
let LP_T = null, LP_FIRED = false, LP_XY = null, SCRUB = null;
document.addEventListener('click', e => {
  if (LP_FIRED) { LP_FIRED = false; e.preventDefault(); e.stopPropagation(); return; }
  if (e.target.closest('a[href]')) return;
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.hasAttribute('disabled')) return;
  const f = ACT[t.getAttribute('data-act')]; if (!f) return;
  e.preventDefault();
  f(t, e);
}, true);
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.chart');
  if (c) { SCRUB = c; chartScrub(c, e.clientX); }
  const t = e.target.closest('[data-lp]');
  if (t) { LP_XY = [e.clientX, e.clientY]; clearTimeout(LP_T); LP_T = setTimeout(() => { LP_FIRED = true; const f = ACT[t.getAttribute('data-lp')]; if (f) { f(t); haptic('heavy'); } setTimeout(() => { LP_FIRED = false; }, 700); }, 520); }
});
document.addEventListener('pointermove', e => {
  if (SCRUB) chartScrub(SCRUB, e.clientX);
  if (LP_XY && (Math.abs(e.clientX - LP_XY[0]) > 10 || Math.abs(e.clientY - LP_XY[1]) > 10)) { clearTimeout(LP_T); LP_XY = null; }
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(LP_T); LP_XY = null; if (SCRUB) { chartScrub(SCRUB, 0, true); SCRUB = null; } }));
document.addEventListener('input', e => {
  const t = e.target, k = t.getAttribute('data-in');
  if (t.hasAttribute('data-nx')) { NX[t.getAttribute('data-nx')] = t.value; return; }
  if (t.hasAttribute('data-cl')) { CLOUD_UI[t.getAttribute('data-cl')] = t.value; return; }
  if (!k) return;
  if (k === 'pk') { PK.q = t.value; const s = SHEETS.find(x => x.id === 'picker'); if (s) { const o = $('[data-pklist]', s.el); if (o) o.innerHTML = pkList(); } return; }
  if (k === 'pc') { PC.w = t.value; const s = SHEETS.find(x => x.id === 'palcalc'); if (s) { const o = $('[data-pcout]', s.el); if (o) o.innerHTML = palCalcOut(); } return; }
  const a = S.active; if (!a) return;
  const ae = a.ex[+t.dataset.i]; if (!ae) return;
  const j = +t.dataset.j;
  if (k === 'w') ae.sets[j].w = t.value;
  else if (k === 'r') ae.sets[j].r = t.value;
  else if (k === 'pw') ae.pal[j].w = t.value;
  else if (k === 'pr') ae.pal[j].rr = t.value;
  save();
});
document.addEventListener('change', e => {
  const t = e.target;
  const p = t.getAttribute('data-set'); if (p) setSetting(p, t.value, t.type);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.classList && t.classList.contains('sin')) {
    e.preventDefault();
    const scope = t.closest('.sets') || document;
    const ins = $$('input.sin', scope), i = ins.indexOf(t);
    if (t.getAttribute('data-in') === 'w' && ins[i + 1]) ins[i + 1].focus(); else t.blur();
  } else if (t.classList && (t.classList.contains('fin') || t.classList.contains('nxn') || t.getAttribute('data-in') === 'pk')) t.blur();
});

/* ---------- défilement : barre compacte façon iOS ---------- */
$$('.view').forEach(v => v.addEventListener('scroll', () => { if (v.id === 'v-' + TAB) $('#navbar').classList.toggle('show', v.scrollTop > 46); }, { passive: true }));

/* ---------- horloges ---------- */
setInterval(() => {
  if (S.active) { const t = clock((Date.now() - S.active.start) / 1000); $$('[data-elapsed]').forEach(el => { el.textContent = t; }); }
  if (dkey() !== LAST_DAY && !SHEETS.length) refresh();
}, 1000);
setInterval(() => { const fs = fastState(); if (fs.mode === 'fast') $$('[data-fast-el]').forEach(el => { el.textContent = hm(fs.elapsed); }); }, 20000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (REST.end) tickRest();
  if (TM.iv) tmTick();
  if (S.active && sheetOpen('workout')) keepAwake(true);
  if (!SHEETS.length) refresh();
});

/* ---------- démarrage ---------- */
function init() {
  applyTheme();
  buildTabbar();
  $('#v-today').classList.add('on');
  render('today', true);
  updateTabbar(false); updateNavbar();
  renderMini();
  if (!S.onboarded) showOnboarding();
  if (!STORAGE_OK) setTimeout(() => toast('Stockage indisponible : exporte tes données', 'info', 'var(--orange)'), 1500);
  bootData();
  if (S.settings.voice) setTimeout(vxLoad, 1500);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
}
init();
