<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Coach">
<meta name="application-name" content="My Coach">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="My Coach — ton programme, ta diète, tes progrès et la voix de ton coach, dans une seule app.">
<title>My Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   MY COACH — design system (inspiré iOS 26 / Liquid Glass)
   ========================================================= */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-r:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --soft:cubic-bezier(.22,1,.36,1);
  --rc:22px;
  --r1a:#FF375F;--r1b:#FF9F0A;
  --r2a:#30D158;--r2b:#B6F25C;
  --r3a:#0A84FF;--r3b:#64D2FF;
  --tab-b:max(12px,calc(var(--safe-b) - 6px));
}
html[data-theme=dark]{
  color-scheme:dark;
  --bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--card3:#3A3A3C;--sbg:#1C1C1E;
  --t1:#fff;--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.34);--t4:rgba(235,235,245,.16);
  --sep:rgba(84,84,88,.6);
  --fill:rgba(120,120,128,.36);--fill2:rgba(120,120,128,.24);--fill3:rgba(118,118,128,.15);
  --red:#FF453A;--orange:#FF9F0A;--yellow:#FFD60A;--green:#30D158;--mint:#63E6E2;--teal:#40C8E0;--cyan:#64D2FF;--blue:#0A84FF;--indigo:#5E5CE6;--purple:#BF5AF2;--pink:#FF375F;--gray:#8E8E93;
  --accent:#FF375F;--accent-rgb:255,55,95;
  --glass:rgba(42,42,46,.56);--glass-solid:#26262a;
  --rim:linear-gradient(155deg,rgba(255,255,255,.44),rgba(255,255,255,.07) 26%,rgba(255,255,255,0) 50%,rgba(255,255,255,.05) 76%,rgba(255,255,255,.24));
  --glass-sh:0 14px 44px rgba(0,0,0,.6),inset 0 .5px 0 rgba(255,255,255,.16);
  --lens:rgba(255,255,255,.13);
  --body:rgba(255,255,255,.13);--body2:rgba(255,255,255,.07);
  --seg-thumb:#636366;
}
html[data-theme=light]{
  color-scheme:light;
  --bg:#F2F2F7;--card:#fff;--card2:#F2F2F7;--card3:#E5E5EA;--sbg:#F2F2F7;
  --t1:#000;--t2:rgba(60,60,67,.62);--t3:rgba(60,60,67,.34);--t4:rgba(60,60,67,.16);
  --sep:rgba(60,60,67,.2);
  --fill:rgba(120,120,128,.2);--fill2:rgba(120,120,128,.13);--fill3:rgba(118,118,128,.09);
  --red:#FF3B30;--orange:#FF9500;--yellow:#FFCC00;--green:#34C759;--mint:#00C7BE;--teal:#30B0C7;--cyan:#32ADE6;--blue:#007AFF;--indigo:#5856D6;--purple:#AF52DE;--pink:#FF2D55;--gray:#8E8E93;
  --accent:#FF2D55;--accent-rgb:255,45,85;
  --glass:rgba(255,255,255,.62);--glass-solid:#f8f8fa;
  --rim:linear-gradient(155deg,#fff,rgba(255,255,255,.55) 28%,rgba(255,255,255,.12) 55%,rgba(255,255,255,.4) 80%,rgba(255,255,255,.95));
  --glass-sh:0 10px 34px rgba(0,0,0,.13),0 1px 3px rgba(0,0,0,.06);
  --lens:rgba(0,0,0,.075);
  --body:rgba(0,0,0,.1);--body2:rgba(0,0,0,.05);
  --seg-thumb:#fff;
}
html[data-theme=dark] .sheet{--card:#2C2C2E;--card2:#3A3A3C;--fill3:rgba(118,118,128,.22)}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#000;-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
body{height:100%;overflow:hidden;font-family:var(--font);font-size:17px;line-height:1.3;letter-spacing:-.008em;color:var(--t1);background:#000;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
input,textarea,select{font:inherit;color:inherit;border:0;outline:0;background:none;-webkit-appearance:none;appearance:none;border-radius:0}
a{color:inherit;text-decoration:none}
svg{display:block}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--font-r);font-variant-numeric:tabular-nums}
.hide{display:none!important}
.muted{color:var(--t2)}
.tiny{font-size:12px;color:var(--t2)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.86)}75%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes dash{from{stroke-dashoffset:var(--o0)}to{stroke-dashoffset:var(--o1)}}
@keyframes barw{from{width:var(--w0)}to{width:var(--w1)}}
@keyframes spinY{0%{transform:perspective(700px) rotateY(-720deg) scale(.3);opacity:0}60%{opacity:1}100%{transform:perspective(700px) rotateY(0) scale(1)}}
@keyframes shine{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(220%) skewX(-18deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes wob{0%{transform:scale(1)}35%{transform:scale(1.14,.9)}70%{transform:scale(.97,1.03)}100%{transform:scale(1)}}
.pop{animation:pop .45s var(--spring)}

/* ---------- glass ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);box-shadow:var(--glass-sh);position:relative;isolation:isolate}
.glass::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;padding:1px;background:var(--rim);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:3}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.glass{background:var(--glass-solid)}}

/* ---------- shell ---------- */
#main{position:fixed;top:0;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden;transform-origin:50% 0;transition:transform .55s var(--ease),border-radius .55s var(--ease),filter .55s var(--ease);will-change:transform}
html.sheet-open #main{transform:translateY(calc(var(--safe-t) + 6px)) scale(.92);border-radius:18px;filter:brightness(.72)}
.view{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(var(--safe-t) + 10px) 0 calc(var(--safe-b) + 116px);display:none}
.view.on{display:block}
#main.has-mini .view{padding-bottom:calc(var(--safe-b) + 182px)}
.view.enter>*{animation:rise .62s var(--soft) both}
.view.enter>*:nth-child(2){animation-delay:.03s}.view.enter>*:nth-child(3){animation-delay:.06s}.view.enter>*:nth-child(4){animation-delay:.09s}.view.enter>*:nth-child(5){animation-delay:.12s}.view.enter>*:nth-child(6){animation-delay:.15s}.view.enter>*:nth-child(7){animation-delay:.18s}.view.enter>*:nth-child(8){animation-delay:.21s}.view.enter>*:nth-child(9){animation-delay:.24s}.view.enter>*:nth-child(n+10){animation-delay:.27s}

/* navbar compacte */
.navbar{position:absolute;top:0;left:0;right:0;z-index:30;height:calc(var(--safe-t) + 46px);padding:var(--safe-t) 16px 0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;border-radius:0}
.navbar::before{display:none}
.navbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.5px;background:var(--sep)}
.navbar.show{opacity:1;pointer-events:auto}
.navbar .nt{font-size:17px;font-weight:600;letter-spacing:-.02em}

/* large title */
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 20px 14px}
.lt .eb{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.02em;margin-bottom:3px}
.lt .eb.ac{color:var(--accent)}
.lt h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.lt-r{display:flex;gap:10px;align-items:center;margin-bottom:3px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,var(--r1a),var(--r1b));color:#fff;font-weight:700;font-size:16px;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(var(--accent-rgb),.35);font-size:15px}
.avatar .ico{font-size:20px}
.cbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--t1);background:var(--fill2);flex:none;transition:transform .25s var(--spring)}
.cbtn:active{transform:scale(.9)}

/* sections */
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 10px}
.sec h2{font-size:22px;font-weight:700;letter-spacing:-.025em}
.sec .lnk{font-size:15px;color:var(--accent);font-weight:500}
.sec .sub{font-size:13px;color:var(--t2);font-weight:500}

/* cards */
.card{background:var(--card);border-radius:var(--rc);padding:16px;margin:0 16px 12px;position:relative;overflow:hidden}
.card.tap{transition:transform .3s var(--spring)}
.card.tap:active{transform:scale(.975)}
.ch{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:10px}
.ch .ico{font-size:17px}
.ch .r{margin-left:auto;font-size:13px;font-weight:500;color:var(--t2);display:flex;align-items:center;gap:2px}
.ch .r .ico{font-size:13px;stroke-width:2.4;color:var(--t3)}
.big{font-family:var(--font-r);font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-family:var(--font);font-size:17px;font-weight:600;color:var(--t2);letter-spacing:0;margin-left:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px 12px}
.grid2 .card{margin:0}

/* buttons */
.btn{height:50px;padding:0 22px;border-radius:25px;font-size:17px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .3s var(--spring),opacity .2s,background .2s;white-space:nowrap;position:relative;overflow:hidden}
.btn:active{transform:scale(.96)}
.btn .ico{font-size:19px;stroke-width:2.2}
.btn-p{background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(var(--accent-rgb),.32),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-c{background:var(--c,var(--accent));color:#fff;box-shadow:0 8px 22px rgba(var(--crgb,var(--accent-rgb)),.34),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-g{background:var(--green);color:#fff;box-shadow:0 8px 22px rgba(48,209,88,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-t{background:rgba(var(--crgb,var(--accent-rgb)),.15);color:var(--c,var(--accent))}
.btn-f{background:var(--fill2);color:var(--t1)}
.btn-d{background:rgba(255,69,58,.14);color:var(--red)}
.btn-w{background:#fff;color:#000}
.btn-b{width:100%}
.btn-s{height:36px;padding:0 15px;border-radius:18px;font-size:15px}
.btn-s .ico{font-size:16px}
.btn[disabled]{opacity:.4;pointer-events:none}
.ib{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:var(--fill2);font-size:18px;color:var(--t1);flex:none;transition:transform .25s var(--spring)}
.ib:active{transform:scale(.88)}
.ib.p{background:var(--accent);color:#fff}
.ib.g{background:var(--green);color:#fff}
.ib .ico{stroke-width:2.2}

/* lists */
.list{background:var(--card);border-radius:var(--rc);margin:0 16px 12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:var(--ri,16px);right:0;height:.5px;background:var(--sep)}
.list.ic .row+.row::before{left:58px}
.row.tap{transition:background .15s}
.row.tap:active{background:var(--fill3)}
.row .rt{flex:1;min-width:0}
.row .t1{font-size:17px;letter-spacing:-.015em}
.row .t2{font-size:13px;color:var(--t2);margin-top:1px}
.row .rv{color:var(--t2);font-size:17px;text-align:right;white-space:nowrap}
.row .chev{color:var(--t3);font-size:14px;stroke-width:2.6}
.tile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:17px;flex:none;background:var(--c,var(--gray))}
.tile .ico{stroke-width:2.1}
.tile.lg{width:40px;height:40px;border-radius:12px;font-size:21px}
.foot{font-size:13px;color:var(--t2);padding:0 32px 18px;line-height:1.4}
.lhd{font-size:13px;color:var(--t2);text-transform:uppercase;letter-spacing:.02em;padding:8px 32px 7px}

/* controls */
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .32s var(--spring)}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
.seg{display:flex;position:relative;background:var(--fill2);border-radius:999px;padding:2px;margin:0 16px 14px;isolation:isolate}
.seg button{flex:1;height:32px;font-size:13px;font-weight:600;border-radius:999px;position:relative;z-index:2;color:var(--t1);transition:opacity .2s;white-space:nowrap;padding:0 6px}
.seg .th{position:absolute;z-index:1;top:2px;bottom:2px;left:2px;border-radius:999px;background:var(--seg-thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transform:translateX(var(--x1));animation:thumb .48s var(--spring) both}
@keyframes thumb{from{transform:translateX(var(--x0))}to{transform:translateX(var(--x1))}}
@keyframes fillUp{from{height:0}to{height:100%}}
.fin{text-align:right;font-size:17px;color:var(--t2);width:46%;max-width:180px;min-height:30px;background:none;font-family:var(--font)}
.fin[type=date],.fin[type=time]{width:auto;min-width:96px;color:var(--accent);font-weight:500}
.fin::-webkit-date-and-time-value{text-align:right}
label.row{cursor:text}
.seg.sm button{height:28px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;background:var(--fill2);color:var(--t2);white-space:nowrap}
.chip .ico{font-size:13px;stroke-width:2.2}
.chip.c{background:rgba(var(--crgb),.15);color:var(--c)}
.chip.g{background:rgba(48,209,88,.15);color:var(--green)}
.chip.y{background:rgba(255,214,10,.16);color:var(--yellow)}
html[data-theme=light] .chip.y{color:#B38600}
.stepper{display:inline-flex;align-items:center;background:var(--fill2);border-radius:999px;height:34px;overflow:hidden}
.stepper button{width:44px;height:34px;display:grid;place-items:center;font-size:17px}
.stepper button:active{background:var(--fill)}
.stepper .sv{min-width:56px;text-align:center;font-family:var(--font-r);font-weight:700;font-size:16px}
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--accent));width:var(--w1);animation:barw 1s var(--soft) both}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--t3);display:grid;place-items:center;flex:none;transition:background .25s,border-color .25s,transform .35s var(--spring);color:#fff}
.ck .ico{font-size:16px;stroke-width:3}
.ck .ico path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .04s var(--ease)}
.ck.on{background:var(--c,var(--green));border-color:var(--c,var(--green))}
.ck.on .ico path{stroke-dashoffset:0}
.ck:active{transform:scale(.86)}
.txt{width:100%;min-height:80px;background:var(--fill3);border-radius:14px;padding:12px 14px;font-size:16px;resize:none;line-height:1.4}

/* ---------- tab bar (Liquid Glass) ---------- */
.tabbar{position:absolute;left:14px;right:14px;bottom:var(--tab-b);height:62px;border-radius:31px;display:flex;padding:4px;z-index:40}
.tb{flex:1;position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;letter-spacing:.01em;color:var(--t1);transition:color .35s}
.tb .ico{font-size:24px;stroke-width:1.85;transition:transform .45s var(--spring)}
.tb.on{color:var(--accent)}
.tb:active .ico{transform:scale(.86)}
.lens{position:absolute;z-index:2;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 5);transition:transform .6s var(--spring)}
.lens i{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:27px;background:var(--lens);box-shadow:inset 0 .5px 0 rgba(255,255,255,.22),inset 0 -.5px 0 rgba(255,255,255,.06)}
.lens.wob i{animation:wob .6s var(--soft)}

/* mini player (séance en cours) */
.mini{position:absolute;left:14px;right:14px;bottom:calc(var(--tab-b) + 70px);height:58px;border-radius:29px;z-index:39;display:flex;align-items:center;gap:12px;padding:0 8px 0 9px;transform:translateY(24px) scale(.96);opacity:0;pointer-events:none;transition:transform .5s var(--spring),opacity .3s}
.mini.show{transform:none;opacity:1;pointer-events:auto}
.mini .mi-ring{width:40px;height:40px;position:relative;flex:none}
.mini .mi-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini .mi-ring .ico{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:17px;color:var(--c)}
.mini .mi-t{flex:1;min-width:0}
.mini .mi-a{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mi-b{font-size:13px;color:var(--t2);font-family:var(--font-r);font-variant-numeric:tabular-nums}

/* ---------- sheets ---------- */
.layer{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.scrim{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .45s var(--ease);pointer-events:auto}
.layer.open .scrim{opacity:1}
.layer.under .scrim{opacity:.15}
.sheet{position:relative;width:100%;max-width:520px;max-height:calc(100% - var(--safe-t) - 14px);background:var(--sbg);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .52s var(--ease);pointer-events:auto;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 40px rgba(0,0,0,.35)}
.layer.open .sheet{transform:none}
.layer.under .sheet{transform:scale(.94) translateY(-8px);filter:brightness(.8)}
.sheet.full{height:calc(100% - var(--safe-t) - 10px)}
.sheet.float{width:calc(100% - 16px);max-width:504px;margin-bottom:calc(8px + var(--safe-b));border-radius:36px;max-height:calc(100% - var(--safe-t) - 40px)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--t3);margin:6px auto 0;flex:none}
.sh-in{display:flex;flex-direction:column;min-height:0;flex:1}
.sh-head{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;min-height:54px;position:relative;flex:none}
.sh-head h3{position:absolute;left:64px;right:64px;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.sh-head .sp{flex:1}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(var(--safe-b) + 28px)}
.sheet.float .sh-body{padding-bottom:22px}
.sh-foot{flex:none;padding:10px 16px calc(var(--safe-b) + 12px);background:linear-gradient(180deg,rgba(0,0,0,0),var(--sbg) 30%)}
.sheet.float .sh-foot{padding-bottom:18px}

/* action sheet / alert */
.acts{padding:4px 8px 8px}
.acts .grp{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:8px}
.acts .grp .at{font-size:13px;color:var(--t2);text-align:center;padding:14px 18px 12px;line-height:1.35}
.acts button{width:100%;height:56px;font-size:18px;color:var(--blue);position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
.acts button+button::before,.acts .at+button::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}
.acts button.de{color:var(--red)}
.acts button.bo{font-weight:600}
.acts button:active{background:var(--fill3)}

/* toast + island */
.toast{position:fixed;z-index:450;top:calc(var(--safe-t) + 10px);left:50%;transform:translate(-50%,-160%);display:flex;align-items:center;gap:8px;min-height:44px;padding:0 18px 0 14px;border-radius:22px;font-size:15px;font-weight:600;transition:transform .55s var(--spring);white-space:nowrap;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.toast .ico{font-size:19px;color:var(--c,var(--green));stroke-width:2.3}
.island{position:fixed;z-index:500;top:calc(var(--safe-t) + 6px);left:50%;width:136px;height:38px;margin-left:-68px;border-radius:19px;background:#000;color:#fff;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.4),inset 0 0 0 .5px rgba(255,255,255,.12);transform:translateY(-70px) scale(.5);opacity:0;transition:width .55s var(--spring),height .55s var(--spring),margin .55s var(--spring),border-radius .55s var(--spring),transform .55s var(--spring),opacity .3s;cursor:pointer}
.island.show{transform:none;opacity:1}
html.sheet-open .island{top:calc(var(--safe-t) + 70px)}
html.island-on .toast{top:calc(var(--safe-t) + 54px)}
html.sheet-open.island-on .toast{top:calc(var(--safe-t) + 118px)}
.island.big{width:min(364px,calc(100vw - 20px));margin-left:calc(min(364px,calc(100vw - 20px)) / -2);height:168px;border-radius:44px}
.is-c,.is-b{position:absolute;top:0;left:0;right:0;bottom:0;transition:opacity .3s}
.is-c{display:flex;align-items:center;gap:9px;padding:0 14px 0 5px}
.island.big .is-c{opacity:0;pointer-events:none}
.is-b{opacity:0;pointer-events:none;padding:16px 20px 14px;display:flex;flex-direction:column}
.island.big .is-b{opacity:1;pointer-events:auto;transition-delay:.12s}
.is-ring{width:28px;height:28px;flex:none}
.is-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.is-t{font-family:var(--font-r);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;margin-left:auto;color:#FF9F0A}
.is-l{font-size:13px;font-weight:600;color:rgba(255,255,255,.7)}
.island.done .is-t{color:#30D158}
.is-b .top{display:flex;align-items:center;justify-content:space-between}
.is-b .lab{font-size:13px;font-weight:600;color:rgba(255,255,255,.62)}
.is-b .tm{font-family:var(--font-r);font-size:46px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;color:#FF9F0A}
.island.done .is-b .tm{color:#30D158}
.is-b .pb{height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin:12px 0 12px}
.is-b .pb i{display:block;height:100%;background:linear-gradient(90deg,#FF9F0A,#FFD60A);border-radius:inherit;transition:width .25s linear}
.is-b .btns{display:flex;gap:8px}
.is-b .btns button{flex:1;height:38px;border-radius:19px;background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:600}
.is-b .btns button.go{background:#FF9F0A;color:#000}

/* ---------- résumé ---------- */
.rings-card{display:flex;align-items:center;gap:20px;padding:18px 18px 18px 16px}
.rings-cv{width:150px;height:150px;flex:none}
.rl+.rl{margin-top:11px}
.rl .k{font-size:15px;font-weight:600;letter-spacing:-.015em}
.rl .v{font-family:var(--font-r);font-size:23px;font-weight:700;line-height:1.12;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.rl .v small{font-size:14px;font-weight:700;letter-spacing:.02em}
.hero{margin:0 16px 12px;border-radius:28px;padding:20px 20px 18px;position:relative;overflow:hidden;background:var(--card);isolation:isolate;min-height:214px}
.hero::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;z-index:-1;background:radial-gradient(130% 100% at 105% -5%,rgba(var(--crgb),.62),rgba(var(--crgb),.16) 46%,rgba(var(--crgb),0) 72%),radial-gradient(90% 80% at -10% 110%,rgba(var(--crgb),.2),rgba(var(--crgb),0) 70%)}
html[data-theme=light] .hero::before{opacity:.75}
.hero .bm{position:absolute;right:4px;top:14px;width:46%;max-width:180px;z-index:-1}
.hero .eb{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.hero .tt{font-size:31px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:5px 0 8px;max-width:58%}
.hero .mt{font-size:15px;color:var(--t2);max-width:56%;line-height:1.35}
.hero .cta{margin-top:20px;display:flex;gap:10px;align-items:center}
.hero .state{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--green);margin-top:16px}
.hero .state .ico{font-size:20px;stroke-width:2.4}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 16px 12px}
.wd{border-radius:16px;background:var(--card);padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .3s var(--spring)}
.wd:active{transform:scale(.92)}
.wd .l{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase}
.wd .n{font-size:17px;font-weight:600;font-family:var(--font-r);width:30px;height:30px;border-radius:15px;display:grid;place-items:center}
.wd.today .n{background:var(--accent);color:#fff}
.wd .dt{width:6px;height:6px;border-radius:3px;background:var(--c,var(--t4))}
.wd.done .dt{background:var(--green);box-shadow:0 0 0 2px rgba(48,209,88,.25)}
.wd.rest .dt{background:var(--t4)}
.hab{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 6px;padding:4px 0 2px}
.hb{display:flex;flex-direction:column;align-items:center;gap:7px;transition:transform .3s var(--spring)}
.hb:active{transform:scale(.9)}
.hb .hr{width:64px;height:64px;position:relative}
.hb .hr svg{width:100%;height:100%;transform:rotate(-90deg)}
.hb .hr .tr{fill:none;stroke:rgba(var(--hrgb),.2);stroke-width:5}
.hb .hr .pg{fill:none;stroke:var(--hc);stroke-width:5;stroke-linecap:round;animation:dash .9s var(--soft) both}
.hb .hi{position:absolute;top:10px;left:10px;right:10px;bottom:10px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--hc);background:rgba(var(--hrgb),.14);transition:background .3s,color .3s}
.hb.on .hi{background:var(--hc);color:#fff}
.hb .hl{font-size:12px;font-weight:600;color:var(--t2);text-align:center;line-height:1.2}
.hb .hl b{display:block;font-size:13px;color:var(--t1);font-weight:600}
.mini-stat{display:flex;flex-direction:column;justify-content:space-between;min-height:142px}
.fastmini{display:flex;align-items:center;gap:12px}
.fastmini svg{width:58px;height:58px;transform:rotate(-90deg);flex:none}
.spark{width:100%;height:40px;margin-top:6px}
.rsp{width:54px;height:24px;flex:none}
.rsp .spark{height:24px;margin:0}
.tipcard{padding:18px 18px 16px}
.tipcard .q{font-size:17px;line-height:1.42;letter-spacing:-.015em;font-weight:500}
.tipcard .by{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--t2);font-weight:600}
.streak{display:flex;align-items:center;gap:14px}
.streak .fl{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;color:#fff;background:linear-gradient(160deg,#FF9F0A,#FF375F);box-shadow:0 8px 20px rgba(255,90,60,.3);flex:none}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:9px 5px;margin-top:10px;justify-items:center}
.heat i{width:100%;max-width:26px;aspect-ratio:1;border-radius:50%;background:var(--fill3);position:relative}
.heat i.l1{background:rgba(var(--accent-rgb),.3)}.heat i.l2{background:rgba(var(--accent-rgb),.6)}.heat i.l3{background:var(--accent)}
.heat i.td{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--t1)}
.heat i.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--fill3)}
.heat-h{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px;font-size:10px;font-weight:700;color:var(--t3);text-align:center}

/* ---------- entraînement ---------- */
.prog-line{display:flex;align-items:center;gap:12px}
.prog-line .bar{flex:1;height:8px;border-radius:4px}
.scard{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;min-height:118px;isolation:isolate}
.scard::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;z-index:-1;background:radial-gradient(90% 120% at 100% 50%,rgba(var(--crgb),.26),rgba(var(--crgb),0) 65%)}
.scard .st{flex:1;min-width:0}
.scard .se{font-size:12px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.05em}
.scard .scn{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:3px 0 4px}
.scard .sm{font-size:13px;color:var(--t2);line-height:1.35}
.scard .bmw{width:104px;flex:none}
.glove{width:86px;height:86px;flex:none;display:grid;place-items:center;font-size:62px;color:var(--c);margin-right:6px}
.exl .row{align-items:flex-start;padding-top:12px;padding-bottom:12px}
.exn{width:26px;height:26px;border-radius:9px;background:rgba(var(--crgb),.16);color:var(--c);font-size:13px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px;font-family:var(--font-r)}
.vlink{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:13px;font-weight:600;color:var(--c);background:rgba(var(--crgb),.12);padding:5px 10px;border-radius:12px}
.vlink .ico{font-size:14px}

/* séance live */
.wk-top{display:flex;align-items:center;gap:10px;padding:8px 14px 10px;flex:none}
.wk-tt{flex:1;text-align:center;min-width:0}
.wk-tt .a{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.015em}
.wk-tt .b{font-family:var(--font-r);font-size:13px;color:var(--t2);font-variant-numeric:tabular-nums;margin-top:1px}
.wk-bar{height:3px;background:var(--fill3);margin:0 18px 2px;border-radius:2px;overflow:hidden;flex:none}
.wk-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--green));transition:width .5s var(--soft);border-radius:inherit}
.wk-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 12px;background:var(--card);border-radius:22px;padding:13px 0}
.wk-stats>div{text-align:center;position:relative}
.wk-stats>div+div::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:.5px;background:var(--sep)}
.wk-stats b{display:block;font-family:var(--font-r);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wk-stats span{font-size:12px;color:var(--t2);font-weight:500}
.wu{margin:0 12px 12px;background:var(--card);border-radius:22px;overflow:hidden}
.wu-h{display:flex;align-items:center;gap:12px;padding:14px 16px}
.wu-b{padding:0 16px 14px}
.wu-it{display:flex;align-items:center;gap:12px;padding:10px 0;position:relative}
.wu-it+.wu-it::before{content:"";position:absolute;top:0;left:40px;right:0;height:.5px;background:var(--sep)}
.wu-it .t{flex:1;font-size:15px;line-height:1.35}
.xcard{background:var(--card);border-radius:24px;margin:0 12px 12px;padding:14px 12px 12px 14px;position:relative;transition:box-shadow .3s}
.xcard.ss{box-shadow:inset 3px 0 0 var(--purple)}
.xcard.alldone{box-shadow:inset 0 0 0 1.5px rgba(48,209,88,.45)}
.ss-tag{position:absolute;top:-1px;right:58px;font-size:10px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--purple);padding:3px 8px;border-radius:0 0 8px 8px}
.xh{display:flex;align-items:flex-start;gap:12px}
.xi{width:40px;height:40px;border-radius:13px;background:rgba(var(--crgb),.16);color:var(--c);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;font-family:var(--font-r);transition:background .3s,color .3s}
.xcard.alldone .xi{background:var(--green);color:#fff}
.xt{flex:1;min-width:0;padding-top:1px}
.xn{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.xs{font-size:13px;color:var(--t2);margin-top:2px}
.xnote{margin-top:10px;font-size:13px;color:var(--t2);display:flex;gap:7px;align-items:flex-start;line-height:1.35}
.xnote .ico{font-size:15px;margin-top:1px;color:var(--t3)}
.xgoal{margin-top:10px;padding:9px 12px;border-radius:13px;background:rgba(var(--crgb),.1);font-size:13px;display:flex;gap:9px;align-items:flex-start;line-height:1.35}
.xgoal .ico{font-size:16px;color:var(--c);margin-top:0;flex:none}
.xgoal.up{background:rgba(48,209,88,.13)}
.xgoal.up .ico{color:var(--green)}
.xpal{margin-top:8px;width:100%;display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:13px;background:var(--fill3);font-size:13px;color:var(--t2);text-align:left}
.xpal .ico{font-size:15px;color:var(--yellow)}
html[data-theme=light] .xpal .ico{color:#C99700}
.xpal b{color:var(--t1);font-weight:600}
.xpal .chev{margin-left:auto;font-size:13px;transition:transform .3s}
.xpal.open .chev{transform:rotate(90deg)}
.sets{margin-top:10px}
.sg{display:grid;grid-template-columns:30px minmax(0,1fr) 68px 58px 40px;gap:6px;align-items:center}
.shd{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.05em;padding:0 0 5px;text-transform:uppercase}
.shd span{text-align:center}
.shd span:nth-child(2){text-align:left;padding-left:4px}
.srow{padding:3px 0;border-radius:13px;transition:background .3s;margin:0 -4px;padding-left:4px;padding-right:4px}
.srow.done{background:rgba(48,209,88,.15)}
.srow.warm.done{background:rgba(255,214,10,.13)}
.sn{font-weight:700;font-size:15px;text-align:center;color:var(--t2);font-family:var(--font-r)}
.srow.warm .sn{color:var(--yellow);font-size:13px}
html[data-theme=light] .srow.warm .sn{color:#C99700}
.srow.drop .sn{color:var(--t3);font-size:17px}
.spv{font-size:13px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px;font-variant-numeric:tabular-nums}
.sin{height:40px;width:100%;border-radius:11px;background:var(--fill3);text-align:center;font-size:17px;font-weight:600;font-family:var(--font-r);color:var(--t1);font-variant-numeric:tabular-nums;transition:background .2s,box-shadow .2s}
.sin::placeholder{color:var(--t3);font-weight:500;opacity:1}
.sin:focus{background:var(--card2);box-shadow:inset 0 0 0 2px var(--c)}
.sin[disabled]{opacity:.35}
.srow.done .sin{background:transparent}
.sck{width:38px;height:38px;border-radius:12px;background:var(--fill2);display:grid;place-items:center;color:transparent;transition:background .25s,color .25s,transform .35s var(--spring);justify-self:end}
.sck .ico{font-size:20px;stroke-width:3}
.srow.done .sck{background:var(--green);color:#fff}
.srow.warm.done .sck{background:var(--yellow);color:#000}
.sck:active{transform:scale(.84)}
.prb{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 7px;border-radius:10px;background:linear-gradient(135deg,#FFD60A,#FF9F0A);color:#000;font-size:10.5px;font-weight:800;letter-spacing:.02em;vertical-align:middle}

.xfoot{display:flex;gap:8px;margin-top:10px}
.xb{flex:1;height:38px;border-radius:13px;background:var(--fill3);font-size:14px;font-weight:600;color:var(--t1);display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .25s var(--spring)}
.xb:active{transform:scale(.95)}
.xb .ico{font-size:16px;stroke-width:2.2;color:var(--t2)}
.sum-hero{text-align:center;padding:8px 20px 6px}
.sum-badge{width:96px;height:96px;margin:6px auto 14px;border-radius:50%;display:grid;place-items:center;font-size:48px;color:#fff;background:linear-gradient(150deg,var(--green),#7BE495);box-shadow:0 14px 34px rgba(48,209,88,.35)}
.sum-badge .ico{stroke-width:2.6}
.sum-badge .ico path{stroke-dasharray:40;stroke-dashoffset:40;animation:dash .7s .35s var(--ease) forwards;--o0:40;--o1:0}
.sum-hero h2{font-size:28px;font-weight:800;letter-spacing:-.03em}
.sum-hero p{color:var(--t2);font-size:15px;margin-top:4px}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 16px 12px}
.sum-grid .card{margin:0;padding:14px 16px}
.sum-grid .k{font-size:13px;color:var(--t2);font-weight:600}
.sum-grid .v{font-family:var(--font-r);font-size:26px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.sum-grid .v small{font-size:15px;color:var(--t2);font-family:var(--font)}

/* ---------- nutrition ---------- */
.macro{display:flex;align-items:center;gap:18px}
.kring{width:124px;height:124px;position:relative;flex:none}
.kring svg{width:100%;height:100%;transform:rotate(-90deg)}
.kring .c{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.kring .c span{font-size:12px;color:var(--t2);margin-top:3px;font-weight:500}
.mbars{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}

.mb .bar{height:8px;border-radius:4px}
.fast{display:flex;align-items:center;gap:18px}
.fring{width:124px;height:124px;position:relative;flex:none}
.fring svg{width:100%;height:100%;transform:rotate(-90deg)}
.fring .c{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fring .c b{font-family:var(--font-r);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}

.fast .ft{flex:1;min-width:0}
.fast .stg{font-size:20px;font-weight:700;letter-spacing:-.02em}
.fast .fs{font-size:13px;color:var(--t2);margin-top:4px;line-height:1.4}
.fast .btn{margin-top:12px}
.stages{display:flex;gap:4px;margin-top:14px}
.stages i{flex:1;height:4px;border-radius:2px;background:var(--fill2)}
.stages i.on{background:var(--c,var(--orange))}
.tl{position:relative;margin:0 16px 4px;padding-left:24px}
.tl::before{content:"";position:absolute;left:8px;top:24px;bottom:24px;width:2px;background:var(--fill2);border-radius:1px}
.tli{position:relative;margin-bottom:10px}
.tli>.dot{position:absolute;left:-21px;top:21px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2.5px solid var(--t3);transition:all .3s}
.tli.done>.dot{background:var(--green);border-color:var(--green)}
.tli.train>.dot{border-color:var(--accent);background:var(--accent)}

.trn .ico{font-size:20px}
.trn small{display:block;font-size:12px;color:var(--t2);font-weight:500;margin-top:1px}
.meal{background:var(--card);border-radius:22px;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px}
.meal-h .mt{flex:1;min-width:0}
.meal-h .tm{font-size:11px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.05em}
.meal-h .nm{font-size:18px;font-weight:700;letter-spacing:-.025em;margin-top:2px}
.meal-h .mc{font-size:13px;color:var(--t2);margin-top:2px;font-variant-numeric:tabular-nums}
.meal-h .kc{font-family:var(--font-r);font-size:15px;font-weight:700;color:var(--t2);text-align:right}
.meal-b{padding:0 0 4px}
.food{display:flex;align-items:center;gap:12px;padding:10px 16px;position:relative;transition:opacity .2s}
.food+.food::before,.meal-b .food:first-child::before{content:"";position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--sep)}
.meal-b .food:first-child::before{left:16px}
.food .ck{width:24px;height:24px}
.food .ck .ico{font-size:13px}
.food .fn{flex:1;min-width:0;font-size:15px;letter-spacing:-.01em}
.food .fn small{display:block;font-size:12px;color:var(--t2);margin-top:1px}
.food .fk{font-family:var(--font-r);color:var(--t2);font-size:14px;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.food.on .fn{color:var(--t2)}
.extra{display:flex;gap:6px;flex-wrap:wrap;padding:4px 16px 12px}
.water{display:flex;align-items:center;gap:14px}
.glasses{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;min-width:0}
.gl{aspect-ratio:.68;border-radius:3px 3px 7px 7px;background:var(--fill3);position:relative;overflow:hidden}
.gl i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#64D2FF,#0A84FF);transition:height .5s var(--spring)}
.gl.on i{height:100%}
.rules .row{align-items:flex-start;padding-top:12px;padding-bottom:12px}
.rules .t1{font-size:15px;line-height:1.35}
.shop .row .t1{font-size:16px}
.shop .row.on .t1{color:var(--t3);text-decoration:line-through}

/* ---------- progrès ---------- */
.chart{position:relative;touch-action:pan-y}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .gl1{stroke:var(--sep);stroke-width:.6;stroke-dasharray:2 3}
.chart .ax{font-size:10px;fill:var(--t3);font-family:var(--font);font-weight:500}
.chart .scr{position:absolute;top:0;bottom:22px;width:1px;background:var(--t3);opacity:0;pointer-events:none;transition:opacity .15s}
.chart .tip{position:absolute;top:-8px;transform:translateX(-50%);background:var(--card2);border-radius:12px;padding:6px 10px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 6px 18px rgba(0,0,0,.25);text-align:center}
.chart .tip b{display:block;font-family:var(--font-r);font-size:17px;font-weight:700}
.chart.scrub .scr,.chart.scrub .tip{opacity:1}
.chart .sdot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 3px var(--card);opacity:0;pointer-events:none}
.chart.scrub .sdot{opacity:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px}
.kpis .card{margin:0;padding:14px 16px}
.kpis .k{font-size:13px;color:var(--t2);font-weight:600}
.kpis .v{font-family:var(--font-r);font-size:24px;font-weight:700;margin-top:3px;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.kpis .v small{font-family:var(--font);font-size:14px;color:var(--t2);font-weight:600}
.kpis .s{font-size:12px;color:var(--t2);margin-top:2px}
.goalbar{position:relative;height:10px;border-radius:5px;background:var(--fill2);margin:14px 0 8px;overflow:visible}
.goalbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,var(--r2a),var(--r2b));width:var(--w1);animation:barw 1.1s var(--soft) both}
.goalbar b{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3),inset 0 0 0 5px var(--r2a);left:var(--w1)}
.gb-l{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:12px 2px}
.cal .h{font-size:12px;font-weight:600;color:var(--t3);text-align:center}
.cal .d{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--t2);font-weight:600;font-family:var(--font-r)}
.cal .d svg{width:36px;height:36px;transform:rotate(-90deg)}
.cal .d.td .n{color:var(--accent)}
.cal .d.fut{opacity:.35}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calnav b{font-size:17px;font-weight:700;letter-spacing:-.02em;text-transform:capitalize}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px}
.md{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.md .mn{font-size:12px;font-weight:600;line-height:1.2}
.md .ms{font-size:11px;color:var(--t2);margin-top:-5px}
.medal{width:78px;height:78px;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.85),rgba(255,255,255,0) 30%),conic-gradient(from 200deg,var(--m1),var(--m2),var(--m1),var(--m3),var(--m1));box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),inset 0 -6px 12px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.3);overflow:hidden}
.medal::before{content:"";position:absolute;top:8px;left:8px;right:8px;bottom:8px;border-radius:50%;background:radial-gradient(circle at 35% 28%,var(--m2),var(--m1) 72%);box-shadow:inset 0 2px 3px rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.35)}
.medal::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:translateX(-120%) skewX(-18deg)}
.medal.shine::after{animation:shine 1.4s .9s var(--ease)}
.medal .ico{position:relative;z-index:1;font-size:32px;color:#fff;stroke-width:2.1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.medal.lk{background:var(--fill3);box-shadow:inset 0 0 0 1px var(--fill2)}
.medal.lk::before{background:var(--fill3);box-shadow:none}
.medal.lk .ico{color:var(--t3);filter:none}
.medal .mp{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg);z-index:2}
.medal.xl{width:170px;height:170px}
.medal.xl::before{top:16px;left:16px;right:16px;bottom:16px}
.medal.xl .ico{font-size:72px}
.medal.spin{animation:spinY 1.6s var(--soft) both}
.wbars{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:8px}
.wbars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.wbars .b i{width:100%;border-radius:6px 6px 3px 3px;background:var(--fill2);min-height:4px;transition:height .8s var(--soft)}
.wbars .b.on i{background:linear-gradient(180deg,var(--r1b),var(--r1a))}
.wbars .b.cur i{background:linear-gradient(180deg,var(--r3b),var(--r3a))}
.wbars .b span{font-size:9px;color:var(--t3);font-weight:600}
.prs{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;margin-bottom:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
.prs::-webkit-scrollbar{display:none}
.prc{flex:none;width:150px;background:var(--card);border-radius:20px;padding:14px;scroll-snap-align:start;position:relative;overflow:hidden}
.prc::before{content:"";position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,10,.35),rgba(255,214,10,0) 70%)}
.prc .pn{font-size:13px;font-weight:600;line-height:1.25;height:33px;overflow:hidden}
.prc .pv{font-family:var(--font-r);font-size:19px;font-weight:700;margin-top:8px;letter-spacing:-.01em}
.prc .pd{font-size:12px;color:var(--t2);margin-top:2px}

/* ---------- coach ---------- */
.cc{padding:18px}
.cc .cch{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cc .cch h3{font-size:19px;font-weight:700;letter-spacing:-.025em}
.cc p,.cc li{font-size:15px;line-height:1.5;color:var(--t2);letter-spacing:-.01em}
.cc p+p{margin-top:8px}
.cc b{color:var(--t1);font-weight:600}
.cc ul{list-style:none;margin-top:6px}
.cc li{position:relative;padding-left:18px;margin-top:7px}
.cc li::before{content:"";position:absolute;left:3px;top:9px;width:6px;height:6px;border-radius:3px;background:var(--c,var(--accent))}
.steps{display:flex;align-items:flex-end;gap:8px;height:150px;margin:16px 0 10px}
.step{flex:1;border-radius:12px 12px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;color:#fff;font-weight:700;font-size:15px;font-family:var(--font-r);background:linear-gradient(180deg,rgba(var(--crgb),.95),rgba(var(--crgb),.4));transform-origin:bottom;animation:growY .8s var(--soft) both}
.step small{font-family:var(--font);font-weight:600;opacity:.88;font-size:11px;margin-top:2px}
.step.wk{background:linear-gradient(180deg,var(--green),rgba(48,209,88,.45))}
@keyframes growY{from{transform:scaleY(.1);opacity:0}to{transform:none;opacity:1}}
.ptable{display:grid;grid-template-columns:1fr auto 1fr;gap:8px 10px;align-items:center;margin-top:10px}
.ptable .a,.ptable .b{height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-r);font-weight:700;font-size:17px}
.ptable .a{background:var(--fill3)}
.ptable .b{background:rgba(48,209,88,.15);color:var(--green)}
.ptable .ar{color:var(--t3);font-size:16px}
.tempo{display:flex;gap:6px;margin-top:12px}
.tempo div{border-radius:12px;padding:10px 12px;font-size:13px;color:var(--t2);font-weight:600}
.tempo div b{display:block;font-family:var(--font-r);font-size:20px;color:var(--t1)}
.calc{display:flex;gap:10px;align-items:center;margin-top:14px}
.calc .sin{width:96px;flex:none}

/* ---------- minuteur ---------- */
.tmr{display:flex;flex-direction:column;align-items:center;padding:0 20px 10px}
.tmr-ring{position:relative;width:min(76vw,290px);aspect-ratio:1;margin-top:6px}
.tmr-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tmr-ring .tbg{fill:none;stroke:var(--fill2)}
.tmr-ring .tfg{fill:none;stroke-linecap:round;transition:stroke .4s}
.tmr-c{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tmr-ph{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;transition:color .3s}
.tmr-t{font-family:var(--font-r);font-size:min(19vw,78px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1;margin:6px 0}
.tmr-r{font-size:15px;color:var(--t2);font-weight:600}
.tmr-ctl{display:flex;align-items:center;gap:30px;margin:26px 0 8px}
.tmr-big{width:84px;height:84px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:34px;box-shadow:0 12px 30px rgba(var(--crgb),.45);transition:transform .3s var(--spring),background .3s}
.tmr-big:active{transform:scale(.92)}
.tmr-sm{width:58px;height:58px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;font-size:22px;transition:transform .3s var(--spring)}
.tmr-sm:active{transform:scale(.9)}
.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 16px 12px}
.pre{background:var(--card);border-radius:18px;padding:12px 14px;text-align:left;transition:transform .3s var(--spring),box-shadow .2s}
.pre:active{transform:scale(.96)}
.pre.on{box-shadow:inset 0 0 0 2px var(--c)}
.pre b{display:block;font-size:15px;font-weight:700}
.pre span{font-size:12px;color:var(--t2)}

/* ---------- pavé numérique ---------- */
.kdisp{text-align:center;padding:4px 20px 6px}
.kdisp .v{font-family:var(--font-r);font-size:76px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.kdisp .v .cur{display:inline-block;width:3px;height:58px;background:var(--accent);margin-left:3px;vertical-align:-6px;border-radius:2px;animation:pulse 1s infinite}
.kdisp .u{font-size:26px;color:var(--t2);font-weight:600;margin-left:6px;font-family:var(--font)}
.kdisp .s{font-size:14px;color:var(--t2);margin-top:8px;min-height:18px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 22px 4px}
.kp button{height:60px;border-radius:30px;background:var(--fill3);font-size:28px;font-weight:500;font-family:var(--font-r);transition:background .12s,transform .2s var(--spring);display:grid;place-items:center}
.kp button:active{background:var(--fill);transform:scale(.94)}
.kp button .ico{font-size:24px}
.dchips{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.dchips button{height:32px;padding:0 14px;border-radius:16px;background:var(--fill3);font-size:14px;font-weight:600;color:var(--t2)}
.dchips button.on{background:var(--t1);color:var(--bg)}

/* ---------- onboarding ---------- */
.ob{position:fixed;top:0;left:0;right:0;bottom:0;z-index:800;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--safe-t) + 18px) 22px calc(var(--safe-b) + 18px);max-width:520px;margin:0 auto;overflow-y:auto}
.ob-st{flex:1;display:flex;flex-direction:column;justify-content:center;animation:rise .6s var(--soft) both;padding-bottom:12px}
.ob h1{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.04}
.ob p.lead{font-size:17px;color:var(--t2);margin-top:12px;line-height:1.45}
.ob .feat{display:flex;gap:14px;align-items:flex-start;margin-top:18px}
.ob .feat b{display:block;font-size:16px;font-weight:600}
.ob .feat span{font-size:14px;color:var(--t2);line-height:1.35}
.field{background:var(--card);border-radius:16px;display:flex;align-items:center;gap:10px;padding:0 16px;min-height:54px;margin-top:10px}
.field label{flex:1;font-size:17px}
.field input{width:130px;text-align:right;font-size:17px;color:var(--t1);height:52px}
.field input::placeholder{color:var(--t3)}
.field .u{color:var(--t2);font-size:17px}
.ob .seg{margin-left:0;margin-right:0}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 16px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--t4);transition:all .35s var(--spring)}
.dots i.on{width:22px;background:var(--t1)}
.logo-rings{width:120px;height:120px;margin-bottom:26px}

/* ---------- bibliothèque d'exercices, programme perso ---------- */
.search{display:flex;align-items:center;gap:8px;margin:0 16px 14px;height:40px;padding:0 12px;border-radius:12px;background:var(--fill2);color:var(--t2)}
.search .ico{font-size:18px;stroke-width:2.2;flex:none}
.search input{flex:1;min-width:0;height:40px;font-size:17px;color:var(--t1)}
.search input::placeholder{color:var(--t3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.row.dis{opacity:.5}
.pkp{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;background:rgba(10,132,255,.14);color:var(--blue);font-size:16px;flex:none}
.pkp .ico,.pkc .ico{stroke-width:2.6}
.pkc{color:var(--green);font-size:18px;flex:none}
.addb{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;background:rgba(10,132,255,.14);color:var(--blue);font-size:16px;flex:none}
.addb .ico{stroke-width:2.5}
.addex{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px);margin:2px 12px 14px;height:54px;border-radius:20px;border:1.5px dashed rgba(10,132,255,.45);color:var(--blue);font-size:16px;font-weight:600;background:rgba(10,132,255,.06);transition:transform .25s var(--spring)}
.addex:active{transform:scale(.97)}
.addex .ico{font-size:19px;stroke-width:2.4}
.erow{padding-top:8px;padding-bottom:8px}
.rmb{width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:15px;flex:none;transition:transform .2s var(--spring)}
.rmb:active{transform:scale(.85)}
.rmb .ico{stroke-width:3}
.eda{display:flex;gap:6px;flex:none}
.eda .ib{width:34px;height:34px;font-size:16px}
.eda .ib[disabled]{opacity:.3;pointer-events:none}
.mchips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px}
.mchip{height:34px;padding:0 14px;border-radius:17px;background:var(--fill2);font-size:14px;font-weight:600;color:var(--t1);transition:background .2s,color .2s,transform .25s var(--spring)}
.mchip:active{transform:scale(.94)}
.mchip.on{background:var(--accent);color:#fff}
.nxn{width:100%;height:30px;font-size:17px;color:var(--t1);background:none}
.nxn::placeholder{color:var(--t3)}
.nxn.sm{font-size:15px}
.nxn.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:0}
/* ---------- sauvegarde cloud ---------- */
.cl-hero{display:flex;gap:14px;align-items:flex-start;padding:2px 20px 18px}
.cl-hero>div>b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.cl-hero>div>span{display:block;font-size:14px;color:var(--t2);line-height:1.4;margin-top:4px}
.cl-hero>div>span b{font-size:14px;color:var(--t1);font-weight:600}
.cl-warn{box-shadow:inset 0 0 0 1.5px rgba(255,159,10,.55)}
.cl-steps .row{align-items:flex-start;padding-top:12px;padding-bottom:12px}
.cl-steps .t2{line-height:1.4;margin-top:3px}
.stn{width:26px;height:26px;border-radius:13px;background:rgba(10,132,255,.14);color:var(--blue);font-weight:800;font-size:14px;display:grid;place-items:center;flex:none;font-family:var(--font-r)}
a.row{color:inherit}
/* ---------- sommeil et pas (Samsung Health) ---------- */
.sante .sa-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sante .k{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.03em}
.sante .big{font-size:27px;margin:3px 0 2px}
.stg{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-top:14px;background:var(--fill2)}
.stg i{display:block;min-width:3px}
.stg-l{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;font-size:12px;color:var(--t2)}
.stg-l b{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:5px}
.slb{position:relative;display:flex;gap:5px;height:150px;padding-top:6px}
.slb .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.slb .bw{flex:1;width:100%;position:relative}
.slb .bw i{position:absolute;left:0;right:0;bottom:0;border-radius:6px 6px 3px 3px;transform-origin:bottom;animation:growY .8s var(--soft) both}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.slb .c span{font-size:11px;font-weight:600;color:var(--t3);height:16px;line-height:16px}
.slb .goal{position:absolute;left:0;right:0;bottom:calc(21px + (100% - 27px) * .7);border-top:1.5px dashed rgba(125,122,255,.75);pointer-events:none}
/* feuilles par-dessus l'écran de bienvenue */
.ob ~ .layer{z-index:850}
body:has(#ob) .toast{z-index:900}

/* erreurs visibles (diagnostic sur téléphone) */
#err{position:fixed;left:10px;right:10px;top:calc(var(--safe-t) + 8px);z-index:9999;background:#2a0b0b;color:#ffd2d2;border:1px solid #ff453a;border-radius:14px;padding:10px 14px;font-size:12px;font-family:ui-monospace,Menlo,monospace;display:none;white-space:pre-wrap;max-height:40vh;overflow:auto}
#cfx{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:700}
@media (min-width:560px){body{background:#000}#main{box-shadow:0 0 0 .5px rgba(255,255,255,.08)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="err"></div>
<div id="main">

function customDef(c) {
  const g = GRP[c.grp] ? c.grp : 'abdos';

    const off = diffDays(t, k) - (sessionsOn(t).length ? 1 : 0);

}

/* poids : tendance lissée (moyenne exponentielle, comme les meilleures applis de suivi) */
function trend() {
  const W = S.weights.slice().sort((a, b) => a.d < b.d ? -1 : 1);
  let t = null, pd = null;
  return W.map(w => {
    if (t === null) t = w.kg;
    else { const dd = Math.max(1, diffDays(pd, w.d)); const a = 1 - Math.pow(.9, dd); t = t + a * (w.kg - t); }
    pd = w.d;
    return { d: w.d, kg: w.kg, t: t };
  });
}
function weightStats() {
  const T = trend();
  if (!T.length) return null;
  const last = T[T.length - 1];
  const cutoff = addDays(last.d, -21);
  const pts = T.filter(x => x.d >= cutoff);
  let slope = 0;
  if (pts.length >= 3 && diffDays(pts[0].d, last.d) >= 5) {
    const xs = pts.map(p => diffDays(pts[0].d, p.d)), ys = pts.map(p => p.t);
    const mx = xs.reduce((a, b) => a + b, 0) / xs.length, my = ys.reduce((a, b) => a + b, 0) / ys.length;
    let nu = 0, de = 0; xs.forEach((x, i) => { nu += (x - mx) * (ys[i] - my); de += (x - mx) * (x - mx); });
    slope = de ? nu / de : 0;
  }
  const w7 = T.filter(x => x.d <= addDays(last.d, -7));
  const delta7 = w7.length ? last.t - w7[w7.length - 1].t : (T.length > 1 ? last.t - T[0].t : 0);
  const start = S.profile.startWeight || T[0].kg;
  const goal = S.profile.goal;
  let eta = null;
  if (slope < -0.005 && last.t > goal) eta = addDays(last.d, Math.round((last.t - goal) / -slope));
  return { T: T, last: last, current: last.kg, trend: last.t, perWeek: slope * 7, delta7: delta7, lost: start - last.kg, start: start, goal: goal, eta: eta,
    pct: clamp((start - last.t) / Math.max(.1, start - goal), 0, 1) };
}

/* historique et records par exercice */
const e1rm = (w, r) => (w > 0 && r > 0) ? w * (1 + r / 30) : 0;
function exHistory(id, excludeActive) {
  const out = [];
  S.sessions.forEach(s => {
    if (s.kind !== 'muscu' && s.kind !== 'cardio') return;
    const e = s.ex.find(x => x.id === id); if (!e) return;
    const ws = e.sets.filter(x => x.t !== 'w' && x.r > 0);
    if (!ws.length) return;
    let best = null, vol = 0, top = 0, maxR = 0;
    ws.forEach(x => { const v = e1rm(x.w, x.r); vol += (x.w || 0) * x.r; if ((x.w || 0) > top) top = x.w || 0; if (x.r > maxR) maxR = x.r; if (!best || v > best.e1 || (v === best.e1 && x.r > best.r)) best = { w: x.w || 0, r: x.r, e1: v }; });
    out.push({ date: s.date, end: s.end || 0, sets: ws, best: best, top: top, vol: vol, maxR: maxR, sid: s.id });
  });
  return out.sort((a, b) => a.end - b.end);
}
function exRecords(id) {
  const H = exHistory(id);
  let e1 = 0, top = 0, reps0 = 0, vol = 0;
  H.forEach(h => { h.sets.forEach(x => { e1 = Math.max(e1, e1rm(x.w, x.r)); top = Math.max(top, x.w || 0); if (!(x.w > 0)) reps0 = Math.max(reps0, x.r); }); vol = Math.max(vol, h.vol); });
  return { e1: e1, top: top, reps0: reps0, vol: vol, n: H.length };
}
function lastPerf(id) { const H = exHistory(id); return H.length ? H[H.length - 1] : null; }
function prevSet(last, i) { if (!last) return null; return last.sets.find(x => x.i === i) || null; }

/* méthode 1 du coach : progresser en reps jusqu'au plafond, puis augmenter la charge */
function suggest(ex, i, last) {
  const t = ex.s[i]; const base = t.r;
  const p = prevSet(last, i);
  if (ex.mode === 'min') return { w: null, r: p ? p.r : base };
  if (ex.mode === 'sec') return { w: null, r: p ? Math.min(p.r + 5, Math.max(60, p.r)) : base };
  if (!p) return { w: null, r: base === 'max' ? null : base };
  if (base === 'max') return { w: p.w || 0, r: p.r + 1 };
  const top = topOf(base);
  if (ex.load === 'pdc') return { w: 0, r: Math.min(p.r + 1, top) };
  if (p.r >= top) return { w: roundTo((p.w || 0) + ex.inc, ex.step || ex.inc), r: base, up: true };

}

  if (ex.mode === 'sec') return { k: 'aim', t: last ? 'Dernière fois : ' + last.sets.map(x => x.r + NB + 's').join(' · ') + '. Objectif : +5 s par série (jusqu’à 60 s).' : 'Tiens chaque série en gardant une posture parfaite. Utilise le chrono intégré.' };

    return { k: 'up', t: 'Plafond atteint (' + topOf(ex.s[0].r) + ' reps) : passe à ' + kg(nw) + NB + 'kg et repars à ' + ex.s[0].r + ' reps. Refais tes paliers.' };

/* jeûne intermittent : le premier repas ouvre la fenêtre, le dîner (ou un démarrage manuel) lance le jeûne */
function fastState() {
  const now = Date.now(), t = dkey(), y = addDays(t, -1);
  const ev = [];
  [y, t].forEach(k => { const r = day(k); Object.keys(r.ft).forEach(m => ev.push({ t: r.ft[m], type: m })); });
  (S.fastLog || []).forEach(e => ev.push(e));
  const past = ev.filter(e => e.t <= now && now - e.t < 40 * 3600e3).sort((a, b) => a.t - b.t);
  const last = past[past.length - 1];
  if (!last) return { mode: 'none' };
  if (last.type === 'din' || last.type === 'start') {
    const st = new Date(last.t);
    const target = new Date(st); target.setHours(12, 0, 0, 0);
    if (st.getHours() >= 12) target.setDate(target.getDate() + 1);
    const total = (target - st) / 1000, el = (now - last.t) / 1000;
    return { mode: 'fast', start: last.t, target: +target, total: total, elapsed: el, pct: clamp(el / total, 0, 1), done: el >= total };

}
function fastStage(fs) {

  if (h < 4) return { i: 1, n: 'Digestion', s: 'Ton dernier repas est en cours de digestion.' };
  if (h < 12) return { i: 2, n: 'Jeûne', s: 'Eau, café ou thé sans sucre uniquement.' };

}

  const d = new Date(); d.setHours(+b[0], +b[1], 0, 0); d.setMinutes(d.getMinutes() - 105);

}

/* cheat meals : aucun le 1er mois, ensuite 1 tous les 10 jours */
function cheatState() {
  const t = dkey();
  const first = addDays(S.profile.startDate, 30);
  const last = S.cheats.length ? S.cheats.slice().sort().pop() : null;

}

/* statistiques globales (trophées) */

  const ws = weightStats();

  const byWeek = {};

  let waterStreak = 0, run = 0, k = S.profile.startDate; const t = dkey(); let g = 0;
  while (k <= t && g++ < 2000) { if (day(k).w >= S.settings.waterGoal) { run++; waterStreak = Math.max(waterStreak, run); } else run = 0; k = addDays(k, 1); }
  const lastCheat = S.cheats.length ? S.cheats.slice().sort().pop() : null;

  return {
    sessions: S.sessions.length, muscu: muscu.length, cardio: S.sessions.filter(s => s.kind === 'cardio').length,
    plank: exRecords('planche').reps0,
    prs: S.sessions.reduce((a, s) => a + ((s.prs || []).length), 0),

}

function smoothPath(P) {
  const n = P.length;
  if (!n) return '';
  const f = v => v.toFixed(1);
  if (n === 1) return 'M' + f(P[0][0]) + ',' + f(P[0][1]);
  if (n === 2) return 'M' + f(P[0][0]) + ',' + f(P[0][1]) + 'L' + f(P[1][0]) + ',' + f(P[1][1]);
  const dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = P[i + 1][0] - P[i][0]; m[i] = dx[i] ? (P[i + 1][1] - P[i][1]) / dx[i] : 0; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = (m[i - 1] * m[i] <= 0) ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = 'M' + f(P[0][0]) + ',' + f(P[0][1]);
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; d += 'C' + f(P[i][0] + h) + ',' + f(P[i][1] + t[i] * h) + ' ' + f(P[i + 1][0] - h) + ',' + f(P[i + 1][1] - t[i + 1] * h) + ' ' + f(P[i + 1][0]) + ',' + f(P[i + 1][1]); }
  return d;
}

function confetti() {
  if (REDUCED) return;
  const cv = $('#cfx'); cv.classList.remove('hide');
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#FF375F', '#FF9F0A', '#FFD60A', '#30D158', '#64D2FF', '#BF5AF2', '#FFFFFF'];
  const P = [];
  for (let i = 0; i < 170; i++) {
    const L = i % 2 === 0, sp = 9 + Math.random() * 13, an = (L ? -1 : -1) * (Math.PI / 2 - (L ? 1 : -1) * (.25 + Math.random() * .55));
    P.push({ x: L ? -8 : W + 8, y: H * .78, vx: Math.cos(an) * sp * (L ? 1 : 1), vy: Math.sin(an) * sp, s: 4 + Math.random() * 5, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - .5) * .35, sh: Math.random() < .55, w: Math.random() * 6 });
  }
  const t0 = performance.now();
  function f(now) {
    const el = now - t0;
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.vy += .3; p.vx *= .988; p.vy *= .988; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.w += .14;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.cos(p.w)); ctx.fillStyle = p.c;
      if (p.sh) ctx.fillRect(-p.s, -p.s * .45, p.s * 2, p.s * .9); else { ctx.beginPath(); ctx.arc(0, 0, p.s * .65, 0, 7); ctx.fill(); }
      ctx.restore();
    });
    if (el < 3600) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, H); cv.classList.add('hide'); }
  }
  requestAnimationFrame(f);
}

function dragToClose(layer) {
  const sh = $('.sheet', layer);

  sh.addEventListener('touchstart', e => {

    const head = e.target.closest('.grab,.sh-head,.wk-top,.dragz');

  }, { passive: false });

function sgn(v, dec) { if (Math.abs(v) < (dec ? .5 * Math.pow(10, -dec) : .5)) return num(0, dec); return (v < 0 ? '−' : '+') + num(Math.abs(v), dec); }
function kpi(k, v, u, s) { return '<div class="card"><div class="k">' + k + '</div><div class="v">' + v + (u ? '<small> ' + u + '</small>' : '') + '</div><div class="s">' + s + '</div></div>'; }
const MEAS = [['waist', 'Tour de taille'], ['chest', 'Poitrine'], ['arm', 'Bras'], ['thigh', 'Cuisse']];
function measuresCard() {

    const v = last && last[m[0]], v0 = first && first[m[0]];

    '<div style="display:flex;gap:14px;justify-content:center;margin-top:14px;font-size:11px;font-weight:600;color:var(--t2)"><span style="color:#FF375F">● Séance</span><span style="color:#30D158">● Protéines</span><span style="color:#0A84FF">● Habitudes</span></div></div>';

  const mon = weekMon(t);

function medal(a, cls, prog) {

function restFor(ex) { return (S.restPref && S.restPref[ex.id]) || ex.rest || 90; }
function hasPal(ex) { return !ex.mode && ex.load !== 'pdc' && ex.load !== 'lest'; }

function prevTxt(ex, p) {
  if (!p) return '—';
  if (ex.mode === 'sec') return p.r + NB + 's';
  if (ex.mode === 'min') return p.r + NB + 'min';
  if (p.w > 0) return kg(p.w) + ' × ' + p.r;
  return (ex.load === 'lest' ? 'PDC × ' : '') + p.r + (ex.load === 'lest' ? '' : ' reps');
}

/* ---------- minuteur (fractionné, gainage, tabata, zone 2) ---------- */
const PRESETS = [
  { id: 'hiit', name: 'Fractionné', d: '30 s / 60 s × 10', w: 30, r: 60, k: 10, c: '#FF375F' },
  { id: 'gain', name: 'Gainage', d: '40 s / 20 s × 8', w: 40, r: 20, k: 8, c: '#30D158' },
  { id: 'tabata', name: 'Tabata', d: '20 s / 10 s × 8', w: 20, r: 10, k: 8, c: '#FF9F0A' },
  { id: 'z2', name: 'Zone 2', d: '35 min en continu', w: 2100, r: 0, k: 1, c: '#0A84FF' }
];
const TM = { id: 'hiit', name: 'Fractionné', w: 30, r: 60, k: 10, c: '#FF375F', phase: 'idle', round: 1, end: 0, left: 30, paused: false, iv: null, onDone: null, beeps: {} };
function openTimer(cfg) {
  const idle = TM.phase === 'idle' || TM.phase === 'done';
  if (cfg && idle) { TM.onDone = null; Object.assign(TM, cfg); }
  if (idle) { TM.phase = 'idle'; TM.round = 1; TM.left = TM.w; TM.paused = false; }
  if (sheetOpen('timer')) { rerenderSheet('timer'); return; }
  openSheet({ id: 'timer', cls: 'full', render: timerHTML, after: paintTimer, onClose: () => { if (TM.phase !== 'idle' && TM.phase !== 'done' && !TM.paused) toast('Le minuteur continue', 'timer', 'var(--orange)'); } });
}
function phaseDur() { return TM.phase === 'prep' ? 10 : TM.phase === 'rest' ? TM.r : TM.w; }
function phaseColor() { return TM.phase === 'prep' ? '#FF9F0A' : TM.phase === 'rest' ? '#0A84FF' : TM.phase === 'done' ? '#30D158' : TM.c; }
function timerHTML() {
  const idle = TM.phase === 'idle' || TM.phase === 'done';
  const c = phaseColor();
  let h = shHead('Minuteur') + '<div class="sh-body" data-tm-body style="--c:' + c + ';--crgb:' + hexRgb(c) + '">';
  const R = 136, C = 2 * Math.PI * R;
  h += '<div class="tmr"><div class="tmr-ring"><svg viewBox="0 0 300 300"><circle class="tbg" cx="150" cy="150" r="' + R + '" stroke-width="16"/><circle class="tfg" data-tm-ring cx="150" cy="150" r="' + R + '" stroke-width="16" stroke="' + c + '" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="0"/></svg>' +
    '<div class="tmr-c"><div class="tmr-ph" data-tm-ph style="color:' + c + '"></div><div class="tmr-t" data-tm-t></div><div class="tmr-r" data-tm-r></div></div></div>' +
    '<div class="tmr-ctl"><button class="tmr-sm" data-act="tmReset" aria-label="Réinitialiser">' + ic('reset') + '</button><button class="tmr-big" data-act="tmToggle" data-tm-btn aria-label="Lecture / pause"></button><button class="tmr-sm" data-act="tmSkip" aria-label="Passer la phase">' + ic('skip') + '</button></div>' +
    '<div class="tiny" style="text-align:center;margin-top:4px">' + esc(TM.name) + ' · ' + (TM.k > 1 ? TM.k + ' tours · ' + clock(TM.w) + ' / ' + clock(TM.r) : clock(TM.w) + ' en continu') + '</div></div>';
  if (idle) {
    h += '<div class="sec"><h2 style="font-size:19px">Préréglages</h2></div><div class="presets">' + PRESETS.map(p => '<button class="pre' + (TM.id === p.id ? ' on' : '') + '" style="--c:' + p.c + '" data-act="tmPreset" data-id="' + p.id + '"><b style="color:' + p.c + '">' + p.name + '</b><span>' + p.d + '</span></button>').join('') + '</div>';
    h += '<div class="sec"><h2 style="font-size:19px">Personnaliser</h2></div><div class="list">' +
      tmStep('Effort', 'w', clock(TM.w)) + tmStep('Récupération', 'r', TM.r ? clock(TM.r) : 'aucune') + tmStep('Tours', 'k', TM.k) + '</div>' +
      '<div class="foot">' + (S.settings.voice ? 'Préparation de 10 s, puis la voix du coach annonce chaque phase et le décompte, même écran verrouillé.' : 'Préparation de 10 s, bips sur les 3 dernières secondes, cloche à chaque effort. L’écran reste allumé.') + '</div>';
  }
  return h + '</div>';
}
function tmStep(label, f, v) {
  return '<div class="row"><div class="rt"><div class="t1">' + label + '</div></div><div class="stepper"><button data-act="tmStep" data-f="' + f + '" data-d="-1" aria-label="Moins">' + ic('minus') + '</button><span class="sv">' + v + '</span><button data-act="tmStep" data-f="' + f + '" data-d="1" aria-label="Plus">' + ic('plus') + '</button></div></div>';
}
function paintTimer() {
  const s = SHEETS.find(x => x.id === 'timer'); if (!s) return;
  const L = s.el, c = phaseColor();
  const idle = TM.phase === 'idle', done = TM.phase === 'done';
  const left = idle ? TM.w : done ? 0 : (TM.paused ? TM.left : Math.max(0, (TM.end - Date.now()) / 1000));
  const tot = idle ? TM.w : done ? 1 : phaseDur();
  const ph = { idle: 'Prêt', prep: 'Préparation', work: 'Effort', rest: 'Récupération', done: 'Terminé' }[TM.phase];
  const set = (sel, v) => { const el = $(sel, L); if (el) el.textContent = v; };
  set('[data-tm-ph]', TM.paused ? 'Pause' : ph);
  set('[data-tm-t]', clock(Math.ceil(left)));
  set('[data-tm-r]', done ? 'Bravo !' : (TM.k > 1 ? 'Tour ' + TM.round + ' / ' + TM.k : (idle ? 'Une seule phase' : 'Continu')));
  const pe = $('[data-tm-ph]', L); if (pe) pe.style.color = c;
  const ring = $('[data-tm-ring]', L);
  if (ring) { const C = 2 * Math.PI * 136; ring.setAttribute('stroke-dashoffset', (C * (1 - clamp(left / Math.max(1, tot), 0, 1))).toFixed(1)); ring.setAttribute('stroke', c); }
  const body = $('[data-tm-body]', L); if (body) { body.style.setProperty('--c', c); body.style.setProperty('--crgb', hexRgb(c)); }
  const btn = $('[data-tm-btn]', L); if (btn) btn.innerHTML = ic((TM.phase === 'idle' || TM.phase === 'done' || TM.paused) ? 'play' : 'pause');
}
function tmStart() {
  TM.phase = 'prep'; TM.round = 1; TM.paused = false; TM.beeps = {}; TM.end = Date.now() + 10000;
  clearInterval(TM.iv); TM.iv = setInterval(tmTick, 200);
  keepAwake(true); haptic(); rerenderSheet('timer'); paintTimer();
  vxTimer();
}
function tmTick() {
  if (TM.paused || TM.phase === 'idle' || TM.phase === 'done') return;
  let left = (TM.end - Date.now()) / 1000;
  const c = Math.ceil(left), key = TM.phase + TM.round + ':' + c;
  if (left > 0 && c <= 3 && !TM.beeps[key]) { TM.beeps[key] = 1; sound('tick'); }
  if (TM.phase === 'work' && TM.w >= 60 && c === 10 && !TM.beeps['w10' + TM.round]) { TM.beeps['w10' + TM.round] = 1; sound('warn'); }
  if (left <= 0) tmNext();
  paintTimer();
}
function tmNext() {
  if (TM.phase === 'prep') { TM.phase = 'work'; TM.end = Date.now() + TM.w * 1000; sound('bell'); haptic('heavy'); }
  else if (TM.phase === 'work') {
    if (TM.round >= TM.k) { tmDone(); return; }
    if (TM.r > 0) { TM.phase = 'rest'; TM.end = Date.now() + TM.r * 1000; sound('go'); haptic(); }
    else { TM.round++; TM.end = Date.now() + TM.w * 1000; sound('bell'); haptic('heavy'); }
  } else if (TM.phase === 'rest') { TM.round++; TM.phase = 'work'; TM.end = Date.now() + TM.w * 1000; sound('bell'); haptic('heavy'); }
}
function tmDone() {
  TM.phase = 'done'; clearInterval(TM.iv); TM.iv = null;
  if (VX.kind === 'timer' && (VX.endAt || 0) - Date.now() > 2500) { vxStop('timer'); vxSay(['beepL', 'tm_done'], 'Minuteur terminé'); }
  sound('end'); haptic('success'); confetti();
  keepAwake(!!S.active);
  const cb = TM.onDone; TM.onDone = null;
  rerenderSheet('timer'); paintTimer();
  if (cb) setTimeout(cb, 300);
}
function tmToggle() {
  if (TM.phase === 'idle' || TM.phase === 'done') { tmStart(); return; }
  if (TM.paused) { TM.paused = false; TM.end = Date.now() + TM.left * 1000; }
  else { TM.paused = true; TM.left = Math.max(0, (TM.end - Date.now()) / 1000); }
  haptic(); paintTimer(); vxTimer();
}
function tmReset() { vxStop('timer'); clearInterval(TM.iv); TM.iv = null; TM.phase = 'idle'; TM.round = 1; TM.paused = false; TM.left = TM.w; keepAwake(!!S.active); rerenderSheet('timer'); paintTimer(); }
function tmSkip() { if (TM.phase === 'idle' || TM.phase === 'done') return; if (TM.paused) { TM.paused = false; } TM.end = Date.now() - 1; tmTick(); haptic(); if (TM.phase !== 'done') vxTimer(); }
function tmStepF(f, d) {
  if (f === 'w') { const st = TM.w >= 120 ? 30 : 5; TM.w = clamp(TM.w + d * st, 5, 3600); }
  if (f === 'r') { const st = TM.r >= 120 ? 30 : 5; TM.r = clamp(TM.r + d * st, 0, 900); }
  if (f === 'k') TM.k = clamp(TM.k + d, 1, 50);
  TM.id = 'custom'; TM.name = 'Personnalisé'; TM.left = TM.w; haptic(); rerenderSheet('timer'); paintTimer();
}
function exTimer(i) {
  const a = S.active; if (!a) return;
  const ae = a.ex[i], ex = EXI[ae.id];
  const j = ae.sets.findIndex(x => !x.done);
  openTimer(Object.assign({ id: 'ex', c: SESS[ex.tpl].color, onDone: j >= 0 ? () => { if (S.active === a && !ae.sets[j].done) { ae.sets[j].r = String(ae.sets[j].target); setCheck(i, j, true); toast(ex.n + ' validé', 'check'); } } : null }, ex.timer));
}
function holdTimer(i) {

  const ae = a.ex[i], ex = EXI[ae.id];
  const todo = ae.sets.map((x, j) => j).filter(j => !ae.sets[j].done);

function kpDisp() { return (KP.v ? esc(KP.v) : '<span style="color:var(--t3)">' + KP.ph + '</span>') + '<span class="cur"></span>'; }
function kpPress(k) {

/* ---------- trophées ---------- */
function checkAwards() {
  const gs = globalStats(), fresh = [];
  AWARDS.forEach(a => { if (S.awards[a.id]) return; const p = a.p(gs); if (p[0] >= p[1]) { S.awards[a.id] = dkey(); fresh.push(a); } });
  if (!fresh.length) return;
  save();
  const show = (i) => { if (i >= fresh.length) return; awardSheet(fresh[i].id, true, () => setTimeout(() => show(i + 1), 450)); };
  show(0);
}

const PK = { mode: 'add', tpl: '', i: -1, q: '', keep: false };

}
function pkTaken() {
  if (PK.mode === 'prog') return progIds(PK.tpl);

function pickerHTML() {

}
function pkList() {
  const q = normTxt(PK.q).trim(), taken = pkTaken();
  const all = Object.keys(EXI).map(id => EXI[id]).filter(e => !e.hidden);
  const words = q.split(/\s+/).filter(Boolean);
  const match = e => { if (!words.length) return true; const t = normTxt(e.n + ' ' + e.eq + ' ' + GRP[exGroup(e)].n); return words.every(w => t.indexOf(w) >= 0); };
  let h = '';
  if (!q) h += '<div class="list ic"><div class="row tap" data-act="exNew"><span class="tile" style="--c:var(--blue)">' + ic('plus') + '</span><div class="rt"><div class="t1" style="color:var(--blue);font-weight:500">Créer un exercice</div><div class="t2">Nom, matériel, séries, reps, repos</div></div></div></div>';
  const mine = all.filter(e => e.custom && match(e));
  if (mine.length) h += '<div class="lhd">Mes exercices</div><div class="list ic">' + mine.map(e => pkRow(e, taken)).join('') + '</div>';
  let n = mine.length;

    const L = all.filter(e => !e.custom && exGroup(e) === g && match(e)).sort((x, y) => (y.coach || 0) - (x.coach || 0) || x.n.localeCompare(y.n, 'fr'));

/* ---------- copie de secours (IndexedDB) ---------- */
let IDBP = null;

      rq.onupgradeneeded = () => { try { rq.result.createObjectStore('kv'); } catch (e) { /* déjà créé */ } };
      rq.onsuccess = () => res(rq.result);

}

  HEALTH.weight.forEach(w => { if (!(w.kg > 25 && w.kg < 300) || !w.t) return; const d = dkey(new Date(w.t)); if (!byDay[d] || w.t > byDay[d].t) byDay[d] = w; });

/* nuits par jour de réveil ; siestes de moins de 1 h 30 ignorées, sessions qui se chevauchent fusionnées */
function healthNights() {
  if (!HEALTH || !Array.isArray(HEALTH.sleep)) return {};
  if (HN_CACHE.at === HEALTH.at) return HN_CACHE.m;
  const by = {}, m = {};
  HEALTH.sleep.forEach(x => { if (!(x.e > x.s) || (x.e - x.s) / 60000 < 90) return; const d = dkey(new Date(x.e)); (by[d] = by[d] || []).push(x); });
  Object.keys(by).forEach(d => {
    const L = by[d].sort((a, b) => a.s - b.s);
    let union = 0, cs = -1, ce = -1;
    L.forEach(x => { if (x.s > ce) { if (ce > cs) union += ce - cs; cs = x.s; ce = x.e; } else ce = Math.max(ce, x.e); });
    if (ce > cs) union += ce - cs;
    const main = L.reduce((a, b) => (b.e - b.s > a.e - a.s ? b : a));
    m[d] = { min: Math.max(0, Math.round(union / 60000 - (main.awake || 0))), s: L[0].s, e: Math.max.apply(null, L.map(x => x.e)), st: main.deep != null,
      deep: main.deep || 0, rem: main.rem || 0, light: (main.light || 0) + (main.sleeping || 0), awake: main.awake || 0 };

}

/* =========================================================
   VOIX DU COACH
   Chaque minuteur est préparé à l'avance comme une piste audio (MP3 assemblé
   à partir de phrases enregistrées) : elle continue écran verrouillé,
   écouteurs branchés, même si l'iPhone met l'app en veille.
